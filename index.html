<style id="reset">:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="appStyle">
/* Caderno quadriculado: fundo de papel milimetrado, login em ficha pautada, atividades como post-its. No escuro, vira lousa. */
:root{
  --chao:#f3f6fb; --quadro:rgba(47,91,170,.11); --cartao:#ffffff; --cartao2:#f7f9fd;
  --tinta:#1d2b53; --tinta2:#55627f; --linha:#d9e1ee;
  --marca:#ffd23f; --marca-borda:#e0ad00; --coral:#d9442f; --verde:#12865f; --azul:#2f63d6;
  --margem:#ef8a8a; --pauta:#c9d9f2;
  --sombra:0 1px 0 rgba(29,43,83,.06),0 10px 26px -14px rgba(29,43,83,.32);
  --n-amarelo:#ffe27a; --n-coral:#ffb4a6; --n-verde:#a6e4c6; --n-azul:#b9d4ff; --n-lilas:#d8c9ff; --n-laranja:#ffc88a;
  --tinta-nota:#1d2b53; --veu:rgba(16,26,48,.5);
  --f-display:'Fredoka','Nunito',system-ui,sans-serif;
  --f-corpo:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chao:#1c2925; --quadro:rgba(232,240,228,.055); --cartao:#25342f; --cartao2:#2c3c36;
  --tinta:#eef3ea; --tinta2:#a9b8b0; --linha:#3b4c46;
  --marca:#ffd23f; --marca-borda:#c99a00; --coral:#ff8b7b; --verde:#61d4a3; --azul:#93b6ff;
  --margem:#b85d5d; --pauta:#3a4c47;
  --sombra:0 1px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.65);
  --n-amarelo:#f0d36c; --n-coral:#f0a598; --n-verde:#97d6b8; --n-azul:#a9c5f2; --n-lilas:#c9baf0; --n-laranja:#f0b97c;
  --veu:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --chao:#1c2925; --quadro:rgba(232,240,228,.055); --cartao:#25342f; --cartao2:#2c3c36;
  --tinta:#eef3ea; --tinta2:#a9b8b0; --linha:#3b4c46;
  --marca:#ffd23f; --marca-borda:#c99a00; --coral:#ff8b7b; --verde:#61d4a3; --azul:#93b6ff;
  --margem:#b85d5d; --pauta:#3a4c47;
  --sombra:0 1px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.65);
  --n-amarelo:#f0d36c; --n-coral:#f0a598; --n-verde:#97d6b8; --n-azul:#a9c5f2; --n-lilas:#c9baf0; --n-laranja:#f0b97c;
  --veu:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--chao);background-image:linear-gradient(var(--quadro) 1px,transparent 1px),linear-gradient(90deg,var(--quadro) 1px,transparent 1px);background-size:26px 26px;color:var(--tinta);font-family:var(--f-corpo);font-size:16px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cartao)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:2px solid var(--linha);background:var(--cartao);padding:9px 16px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.btn-primario{background:var(--marca);border-color:var(--marca-borda);color:var(--tinta-nota);box-shadow:0 3px 0 var(--marca-borda)}
.btn-primario:active{box-shadow:0 1px 0 var(--marca-borda)}
.btn-perigo{border-color:var(--coral);color:var(--coral);background:transparent}
.btn-perigo.confirmar{background:var(--coral);color:#fff}
.btn-texto{border-color:transparent;background:transparent;padding:8px 10px}
.btn-grande{width:100%;padding:13px 18px;font-size:18px}
.btn-pequeno{padding:6px 11px;font-size:14px;border-radius:10px}

/* Formulários */
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-weight:800;font-size:14px;margin-top:8px}
.form .dica{font-size:13px;color:var(--tinta2)}
input[type=text],input[type=password],input:not([type]),textarea,select{width:100%;border:2px solid var(--linha);background:var(--cartao2);border-radius:12px;padding:11px 13px;font-size:16px;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--azul);outline:none}
textarea{min-height:90px;resize:vertical}
.campo-senha{position:relative}
.campo-senha input{padding-right:48px}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:18px;cursor:pointer;padding:6px;border-radius:8px}
.erro{color:var(--coral);font-weight:700;font-size:14px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha2>div{min-width:0;display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.linha2{grid-template-columns:1fr}}

/* Tela de entrada */
.tela-entrada{min-height:100vh;display:grid;place-items:center;padding-block:40px;position:relative;overflow:hidden}
.simbolos{position:absolute;inset:0;pointer-events:none}
.simbolo{position:absolute;font-family:var(--f-display);font-weight:600;color:var(--tinta);opacity:.09;animation:flutua 16s ease-in-out infinite alternate}
@keyframes flutua{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-34px) rotate(10deg)}}
.ficha{position:relative;width:100%;max-width:420px;background:var(--cartao);border-radius:8px;box-shadow:var(--sombra);padding:34px 28px 26px 58px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--pauta) 31px 32px);background-position:0 92px;animation:chega .5s ease-out both}
.ficha::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:var(--margem);opacity:.7}
.ficha::after{content:"";position:absolute;top:-14px;left:50%;width:110px;height:30px;transform:translateX(-50%) rotate(-3deg);background:var(--marca);opacity:.75;border-radius:3px}
@keyframes chega{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:none}}
.ficha.treme{animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ficha-topo{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ficha-topo h1{font-size:26px}
.ficha-topo p{color:var(--tinta2);font-size:15px}
.logo{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--marca);color:var(--tinta-nota);font-family:var(--f-display);font-size:30px;font-weight:700;transform:rotate(-6deg);box-shadow:0 3px 0 var(--marca-borda)}
.logo.mini{width:40px;height:40px;font-size:23px;border-radius:10px}
.ficha .btn-grande{margin-top:16px}
.nota-rodape{margin-top:14px;font-size:13.5px;color:var(--tinta2)}
.aviso{background:var(--cartao2);border:2px dashed var(--linha);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--tinta2)}

/* Topo do app */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cartao);border-bottom:2px solid var(--linha)}
.topo-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.marca-site{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.marca-site b{font-family:var(--f-display);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abas{display:flex;gap:4px;background:var(--cartao2);padding:4px;border-radius:12px;border:1px solid var(--linha)}
.aba{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;color:var(--tinta2)}
.aba[aria-current="page"]{background:var(--marca);color:var(--tinta-nota)}
.usuario{display:flex;align-items:center;gap:6px}
.usuario .quem{font-weight:700;font-size:14px;color:var(--tinta2)}
@media (max-width:720px){.abas{order:3;width:100%;justify-content:space-between}.aba{flex:1}.usuario .quem{display:none}}

main.conteudo{max-width:1180px;margin:0 auto;padding-block:26px 120px;display:flex;flex-direction:column;gap:22px}

/* Saudação e progresso */
.saudacao{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.saudacao h2{font-size:clamp(26px,4vw,36px)}
.saudacao p{color:var(--tinta2);margin-top:4px}
.progresso{background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:12px 16px;min-width:240px;flex:0 1 320px}
.progresso .rot{display:flex;justify-content:space-between;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.barra{height:12px;border-radius:99px;background:var(--cartao2);border:1px solid var(--linha);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--verde) 0 10px,color-mix(in srgb,var(--verde) 80%,#fff) 10px 20px);border-radius:99px;transition:width .6s ease}
.recado{position:relative;background:var(--n-amarelo);color:var(--tinta-nota);border-radius:4px;padding:16px 18px 16px 20px;box-shadow:var(--sombra);max-width:720px;transform:rotate(-.6deg)}
.recado b{font-family:var(--f-display);font-weight:600;font-size:15px;display:block;margin-bottom:2px}
.recado p{white-space:pre-wrap}

/* Ferramentas */
.ferramentas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca{flex:1 1 260px;position:relative}
.busca input{padding-left:40px}
.busca::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:20px;color:var(--tinta2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--linha);background:var(--cartao);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--chao);border-color:var(--tinta)}

/* Cartões de atividade */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.cartao-wrap{position:relative;min-width:0}
.cartao-ativ{width:100%;height:100%;display:flex;flex-direction:column;text-align:left;background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.cartao-ativ:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:var(--sombra)}
.nota{background:var(--n,var(--n-amarelo));height:112px;display:grid;place-items:center;font-size:54px;position:relative}
.nota .tema{position:absolute;left:12px;top:10px;font-size:12px;font-weight:800;color:var(--tinta-nota);background:rgba(255,255,255,.6);padding:2px 9px;border-radius:99px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nota .emoji{transition:transform .25s}
.cartao-ativ:hover .emoji{transform:scale(1.15) rotate(-6deg)}
.corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.corpo h3{font-size:19px}
.corpo p{color:var(--tinta2);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.selo{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:1.5px solid currentColor}
.selo.novo{color:var(--azul)}
.selo.feita{color:var(--verde)}
.selo.jogar{color:var(--tinta2);border-style:dashed}
.btn-editar{position:absolute;top:8px;right:8px;z-index:2;background:var(--cartao);border:2px solid var(--linha);border-radius:10px;padding:5px 10px;font-weight:800;font-size:13px;cursor:pointer}
.cartao-novo{border:3px dashed var(--linha);border-radius:var(--r);background:transparent;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:800;color:var(--tinta2);transition:border-color .15s,color .15s}
.cartao-novo:hover{border-color:var(--azul);color:var(--azul)}
.cartao-novo .mais{font-size:44px;font-family:var(--f-display);line-height:1}
.vazio{text-align:center;padding:48px 16px;background:var(--cartao);border:2px dashed var(--linha);border-radius:var(--r);color:var(--tinta2)}
.vazio h3{color:var(--tinta);font-size:22px;margin-bottom:6px}

/* Painéis */
.painel{background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.painel h2{font-size:22px}
.painel>p{color:var(--tinta2)}
.duas-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media (max-width:860px){.duas-col{grid-template-columns:1fr}}
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);padding:8px 10px;border-bottom:2px solid var(--linha)}
td{padding:10px;border-bottom:1px solid var(--linha);vertical-align:middle}
td.acoes{text-align:right;white-space:nowrap}
.tipo{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--cartao2);border:1px solid var(--linha)}
.tipo.prof{background:var(--n-amarelo);color:var(--tinta-nota);border-color:transparent}
.creds{background:var(--n-verde);color:var(--tinta-nota);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.creds code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:rgba(255,255,255,.55);padding:1px 6px;border-radius:6px}
.creds ul{margin:0;padding-left:18px}
.espaco .barra i{background:var(--azul)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inline-form input{flex:1 1 160px;width:auto}

/* Escolhas de emoji e cor */
.escolhas{display:flex;flex-wrap:wrap;gap:6px}
.esc-emoji{width:44px;height:44px;border-radius:10px;border:2px solid var(--linha);background:var(--cartao2);font-size:22px;cursor:pointer}
.esc-cor{width:38px;height:38px;border-radius:10px;border:3px solid transparent;cursor:pointer;background:var(--n)}
.esc-emoji[aria-pressed="true"]{border-color:var(--azul);background:var(--cartao)}
.esc-cor[aria-pressed="true"]{border-color:var(--tinta)}
.arquivo{border:2px dashed var(--linha);border-radius:12px;padding:16px;text-align:center;background:var(--cartao2);cursor:pointer;display:block;font-weight:700}
.arquivo.tem{border-style:solid;border-color:var(--verde);color:var(--verde)}
.arquivo input{display:none}

/* Modal */
.veu{position:fixed;inset:0;z-index:60;background:var(--veu);display:grid;place-items:center;padding:16px;animation:aparece .15s}
@keyframes aparece{from{opacity:0}}
.modal{width:100%;max-width:580px;max-height:calc(100vh - 32px);overflow:auto;background:var(--cartao);border-radius:18px;box-shadow:var(--sombra);padding:22px;display:flex;flex-direction:column;gap:6px}
.modal-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.modal-topo h2{font-size:22px}
.modal-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.modal-acoes .esp{flex:1}

/* Player */
.player{position:fixed;inset:0;z-index:50;background:var(--chao);display:flex;flex-direction:column}
.player-barra{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;background:var(--cartao);border-bottom:2px solid var(--linha);flex-wrap:wrap}
.player-barra h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player iframe{flex:1;width:100%;border:0;background:#fff}
.btn-feita[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}

/* Barra de salvar e avisos */
.barra-salvar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tinta);color:var(--chao);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(100%)}}
.barra-salvar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barra-salvar .txt{flex:1;min-width:200px;font-weight:700}
.barra-salvar .btn-texto{color:var(--chao)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--tinta);color:var(--chao);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:var(--sombra);max-width:calc(100% - 32px);animation:aparece .2s}
.toast.erro{background:var(--coral);color:#fff}
.ocupado{position:fixed;inset:0;z-index:90;background:var(--veu);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.ocupado span{background:var(--tinta);color:var(--chao);padding:14px 22px;border-radius:14px}
.confete{position:fixed;width:9px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:voa .9s ease-out forwards}
@keyframes voa{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

<script id="portalApp">
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const mkStore = name => ({
  get(k){ try { return window[name].getItem(k); } catch(e){ return null; } },
  set(k,v){ try { window[name].setItem(k,v); } catch(e){} },
  del(k){ try { window[name].removeItem(k); } catch(e){} }
});
const SS = mkStore('sessionStorage'), LS = mkStore('localStorage');
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- Fonte da própria página (para republicar) ---------- */
const FONTS_HTML = '<' + 'link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">';
const RESET_PADRAO = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
const MODO_ARQUIVO = !(window.claude && typeof window.claude.use === 'function');
const headStyle = document.getElementById('reset') || (document.head && document.head.querySelector('style:not(#appStyle)'));
const RESET = (headStyle && headStyle.textContent) || RESET_PADRAO;
const CSS_APP = $('#appStyle').textContent;
const JS_APP = $('#portalApp').textContent;
const TITULO = ($('title') && $('title').textContent) || 'Portal de Atividades';

function montarDocumento(){
  const json = JSON.stringify(PUB).replace(/</g,'\\u003c');
  if (MODO_ARQUIVO) return montarSite(json);
  return '<!doctype html><html><head><' + 'meta charset=utf8><' + 'meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><' + 'style>' + RESET + '<' + '/style></head><body>'
    + '<' + 'title>' + esc(TITULO) + '<' + '/title>\n<' + 'meta name="claude:viewport-fit-sides" content="cover">\n' + FONTS_HTML + '\n'
    + '<' + 'style id="appStyle">' + CSS_APP + '<' + '/style>\n<div id="app"></div>\n'
    + '<' + 'script type="application/json" id="portalData">' + json + '<' + '/script>\n'
    + '<' + 'script id="portalApp">' + JS_APP + '<' + '/script>\n</body></html>';
}

function montarSite(json){
  const LT = '<';
  const base = String(location.href).replace(/[#?].*$/, '').replace(/index\.html$/, '');
  const nome = esc(PUB.site.nome), desc = esc(PUB.site.subtitulo);
  const capa = base + 'capa.png';
  const m = (attr, k, v) => LT + 'meta ' + attr + '="' + k + '" content="' + v + '">\n';
  return LT + '!doctype html>\n' + LT + 'html lang="pt-BR">\n' + LT + 'head>\n'
    + LT + 'meta charset="utf-8">\n'
    + LT + 'title>' + nome + LT + '/title>\n'
    + m('name', 'description', desc)
    + m('property', 'og:type', 'website')
    + m('property', 'og:site_name', nome)
    + m('property', 'og:title', nome)
    + m('property', 'og:description', desc)
    + m('property', 'og:url', esc(base))
    + m('property', 'og:image', esc(capa))
    + m('property', 'og:image:width', '1200')
    + m('property', 'og:image:height', '630')
    + m('property', 'og:locale', 'pt_BR')
    + m('name', 'twitter:card', 'summary_large_image')
    + m('name', 'twitter:image', esc(capa))
    + m('name', 'theme-color', '#ffd23f')
    + LT + 'meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'

}

const DICA_SALVAR = MODO_ARQUIVO ? 'Depois, baixe o portal atualizado.' : 'Publique para os participantes verem.';

/* ---------- Dados públicos (sem conteúdo legível) ---------- */
let PUB;
try { PUB = JSON.parse($('#portalData').textContent || '{}'); } catch(e) { PUB = {}; }
PUB = Object.assign({ v:1, site:{ nome:'Portal de Matemática', subtitulo:'Matemática de um jeito lúdico' }, iter:150000, contas:[], cofre:null, gz:false }, PUB);
let PUB0 = clone(PUB);

/* ---------- Criptografia ---------- */
const b64e = u8 => { let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const b64d = s => { const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
async function sha(t){ const h = await crypto.subtle.digest('SHA-256', enc.encode(t)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
const loginId = l => sha('portal-mat:' + String(l).trim().toLowerCase());
async function chaveDaSenha(pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:PUB.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function lacrar(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64e(out);
}
async function abrir(key, b64){ const a = b64d(b64); return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:a.subarray(0,12) }, key, a.subarray(12))); }
const chaveMestra = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
async function gz(bytes, comprimir){
  if (typeof CompressionStream === 'undefined') return null;
  const s = new Blob([bytes]).stream().pipeThrough(comprimir ? new CompressionStream('gzip') : new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function lacrarCofre(){
  if (PUB.extras && idsCorreio.size) PUB.extras = PUB.extras.filter(e => !idsCorreio.has(e.id));
  const b = enc.encode(JSON.stringify(V));
  const z = await gz(b, true);
  PUB.gz = !!z;
  PUB.cofre = await lacrar(await chaveMestra(MK), z || b);
}
async function abrirCofre(raw){
  let b = await abrir(await chaveMestra(raw), PUB.cofre);
  if (PUB.gz) { const u = await gz(b, false); if (!u) throw new Error('navegador antigo'); b = u; }
  return JSON.parse(dec.decode(b));
}
/* Caixa de correio: atividades enviadas pelo Claude, cifradas com a chave pública do portal */
let idsCorreio = new Set();
async function integrarCorreio(){
  idsCorreio = new Set();
  const extras = PUB.extras || [];
  if (!V || !V.correioPriv || !extras.length) return;
  let priv;
  try { priv = await crypto.subtle.importKey('jwk', V.correioPriv, { name:'ECDH', namedCurve:'P-256' }, false, ['deriveKey']); }
  catch(e){ return; }
  for (const ex of extras){
    try {
      const epk = await crypto.subtle.importKey('raw', b64d(ex.epk), { name:'ECDH', namedCurve:'P-256' }, false, []);
      const k = await crypto.subtle.deriveKey({ name:'ECDH', public:epk }, priv, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      let b = await abrir(k, ex.ct);
      const u = await gz(b, false); if (u) b = u;
      const a = JSON.parse(dec.decode(b));
      idsCorreio.add(ex.id);
      const existente = V.atividades.find(x => x.id === a.id);
      if (!existente) V.atividades.push(a);
      else if (a.atualizacao) existente.html = a.html;   // nova versão: troca só o conteúdo, mantém título e cores
    } catch(e){}
  }
}
async function ativarCorreio(){
  const par = await crypto.subtle.generateKey({ name:'ECDH', namedCurve:'P-256' }, true, ['deriveKey']);
  V.correioPriv = await crypto.subtle.exportKey('jwk', par.privateKey);
  PUB.correio = { pub: b64e(new Uint8Array(await crypto.subtle.exportKey('raw', par.publicKey))) };
  marcarSujo();
}
async function criarConta(id, senha, adm){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { id, salt:b64e(salt), wk: await lacrar(await chaveDaSenha(senha, salt), MK), adm: !!adm };
}
async function destravar(login, senha){
  const id = await loginId(login);
  const c = PUB.contas.find(x => x.id === id);
  const k = await chaveDaSenha(senha, c ? b64d(c.salt) : crypto.getRandomValues(new Uint8Array(16)));
  if (!c) return null;
  try { return { id, raw: await abrir(k, c.wk), adm: c.adm }; } catch(e) { return null; }
}

/* ---------- Som e efeitos ---------- */
let AC = null;
function som(tipo){
  if (!somLigado) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notas = { ok:[523,784], erro:[220,165], feita:[523,659,784,1047], clique:[660] }[tipo] || [600];
    notas.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = tipo === 'erro' ? 'square' : 'triangle'; o.frequency.value = f;
      const t = AC.currentTime + i*0.09, vol = tipo === 'erro' ? 0.06 : 0.16;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.26);
    });
  } catch(e){}
}
function confete(el){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cores = ['#ffd23f','#ff8b7b','#61d4a3','#93b6ff','#c9baf0'];

    c.style.left = (r.left + r.width/2) + 'px'; c.style.top = (r.top + r.height/2) + 'px';
    c.style.background = cores[i % cores.length];

}

async function baixarArquivo(){
  ocupado('Preparando o arquivo…');
  try {
    await lacrarCofre();
    const html = montarDocumento();
    const url = URL.createObjectURL(new Blob([html], { type:'text/html' }));
    const a = document.createElement('a'); a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    PUB0 = clone(PUB); sujo = false; ocupado();
    toast('Arquivo index.html baixado. Envie para o Claude ou para o GitHub para atualizar o site.');
    render(); return true;
  } catch(e){ ocupado(); toast('Não foi possível gerar o arquivo. Tente de novo.', 'erro'); return false; }

async function publicar(){
  if (MODO_ARQUIVO) return baixarArquivo();
  await artPronto;
  if (!ART){ toast('Para salvar, abra o portal pelo Claude, entrando com a sua conta.', 'erro'); return false; }
  ocupado('Salvando e publicando…');
  try {
    await lacrarCofre();
    const html = montarDocumento();
    if (html.length > 15.5e6){ ocupado(); toast('O portal passou do limite de 16 MB. Remova alguma atividade grande e tente de novo.', 'erro'); return false; }
    SS.set('portal_flash', 'Alterações publicadas! Os participantes já veem a versão nova.');
    await ART.publish(html);
    sujo = false; return true;
  } catch(e){
    SS.del('portal_flash'); ocupado();
    const c = e && e.code;
    if (c === 'conflict') toast('O portal foi atualizado em outra janela. Recarregando a versão mais nova…');
    else if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].includes(c))
      toast('Esta janela só pode visualizar. Abra o portal pela conta do Claude que o criou para salvar.', 'erro');
    else if (c === 'too_large') toast('O portal ficou grande demais (limite de 16 MB). Remova alguma atividade.', 'erro');
    else if (c === 'rate_limited') toast('Muitas publicações seguidas. Espere um minuto e tente de novo.', 'erro');
    else toast('Não foi possível publicar agora. Tente de novo em instantes.', 'erro');
    return false;
  }
}

      <p style="color:var(--tinta2)">Com isso, o Claude passa a publicar atividades novas direto no portal, sem você precisar cadastrar uma por uma. Só quem tem login continua vendo o conteúdo.</p>
      <div><button class="btn btn-primario" data-act="ativar-correio">Ativar envio pelo Claude</button></div>
    </aside>` : ''}
    ${V.recado ? `<aside class="recado"><b>Recado</b><p>${esc(V.recado)}</p></aside>` : ''}
    ${ats.length ? `<div class="ferramentas">
      <div class="busca"><input id="busca" type="text" placeholder="Procurar atividade…" value="${esc(filtro.q)}" aria-label="Procurar atividade"></div>
      ${temas.length > 1 ? `<div class="chips" role="group" aria-label="Filtrar por tema">
        <button class="chip" data-act="tema" data-v="" aria-pressed="${!filtro.tema}">Todas</button>
        ${temas.map(t => `<button class="chip" data-act="tema" data-v="${esc(t)}" aria-pressed="${filtro.tema===t}">${esc(t)}</button>`).join('')}
      </div>` : ''}
      ${ME.adm ? `<button class="btn btn-primario" data-act="nova">+ Nova atividade</button>` : ''}
    </div>` : ''}
    <section class="grade" id="grade" aria-live="polite"></section>`;
  const b = $('#busca');
  if (b) b.addEventListener('input', () => { filtro.q = b.value; renderGrade(); });
  renderGrade();
}
function renderGrade(){
  const g = $('#grade'); if (!g) return;
  const f = feitas(), q = norm(filtro.q);
  const ats = V.atividades.slice().sort((a,b) => b.data - a.data)
    .filter(a => (!filtro.tema || a.tema === filtro.tema) && (!q || norm(a.titulo + ' ' + a.desc + ' ' + a.tema).includes(q)));
  if (!V.atividades.length){
    g.style.display = 'block';
    g.innerHTML = ME.adm
      ? `<div class="vazio"><h3>Nenhuma atividade ainda</h3><p>Envie o seu primeiro arquivo HTML e ele aparece aqui como um cartão para os participantes.</p><p style="margin-top:16px"><button class="btn btn-primario" data-act="nova">+ Adicionar a primeira atividade</button></p></div>`
      : `<div class="vazio"><h3>Ainda não há atividades por aqui</h3><p>Assim que novas atividades forem postadas, elas aparecem nesta página.</p></div>`;
    return;
  }
  g.style.display = '';
  const semana = Date.now() - 7*864e5;
  let h = ats.map(a => `
    <div class="cartao-wrap">
      <button class="cartao-ativ" data-act="abrir" data-id="${a.id}" style="--n:var(--n-${a.cor})">
        <div class="nota">${a.tema ? `<span class="tema">${esc(a.tema)}</span>` : ''}<span class="emoji" aria-hidden="true">${esc(a.emoji)}</span></div>
        <div class="corpo"><h3>${esc(a.titulo)}</h3>${a.desc ? `<p>${esc(a.desc)}</p>` : ''}
          <div class="selos">${f.has(a.id) ? '<span class="selo feita">✓ Feita</span>' : '<span class="selo jogar">Abrir ▸</span>'}${a.data > semana ? '<span class="selo novo">Nova</span>' : ''}</div>
        </div>
      </button>
      ${ME.adm ? `<button class="btn-editar" data-act="editar" data-id="${a.id}">Editar</button>` : ''}
    </div>`).join('');
  if (!ats.length) h = `<div class="vazio" style="grid-column:1/-1"><h3>Nada encontrado</h3><p>Tente outra palavra ou escolha “Todas”.</p></div>`;
  if (ME.adm && !filtro.q && !filtro.tema) h = `<button class="cartao-novo" data-act="nova"><span class="mais">+</span>Nova atividade</button>` + h;
  g.innerHTML = h;
}

function abrirPlayer(a, teste){
  tocando = { id:a.id, teste };
  const f = feitas(), feita = f.has(a.id);
  const p = document.createElement('div');
  p.className = 'player'; p.id = 'player'; p.setAttribute('role','dialog'); p.setAttribute('aria-label', a.titulo);
  p.innerHTML = `<div class="player-barra gutter">
      <button class="btn btn-pequeno" data-act="voltar">← Voltar</button>
      <h2>${esc(a.titulo)}${teste ? ' (teste)' : ''}</h2>
      ${teste ? '' : `<button class="btn btn-pequeno btn-feita" data-act="feita" data-id="${a.id}" aria-pressed="${feita}">${feita ? '✓ Feita!' : 'Marcar como feita'}</button>`}
      <button class="btn btn-pequeno" data-act="telacheia" aria-label="Tela cheia">⛶</button>
    </div>
    <iframe title="${esc(a.titulo)}" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock" allow="fullscreen; autoplay; camera; microphone; clipboard-write"></iframe>`;
  document.body.appendChild(p);
  try { history.pushState({ portalPlayer:1 }, ''); } catch(e){}
  p.querySelector('iframe').srcdoc = a.html;
  document.body.style.overflow = 'hidden';
  p.querySelector('[data-act="voltar"]').focus();
}
function fecharPlayer(daHistoria){
  if (!daHistoria && history.state && history.state.portalPlayer){ try { history.back(); return; } catch(e){} }
  const p = $('#player'); if (p) p.remove();
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  const id = tocando && tocando.id; tocando = null;
  renderGrade();
  const prog = $('.progresso'); if (prog) viewAtividades($('#conteudo'));
  const alvo = id && document.querySelector('[data-act="abrir"][data-id="' + id + '"]'); if (alvo) alvo.focus();
}

function gerarSenha(){
  const r = crypto.getRandomValues(new Uint32Array(2));
  return PALAVRAS[r[0] % PALAVRAS.length] + String(100 + r[1] % 900);
}

async function medirEspaco(){
  const cofreAntes = PUB.cofre, gzAntes = PUB.gz;
  try {
    await lacrarCofre();
    const mb = montarDocumento().length / 1048576;
    const t = $('#espTxt'), b = $('#espBarra');
    if (t) t.textContent = mb.toFixed(2).replace('.', ',') + ' MB';
    if (b) b.style.width = Math.min(100, mb/16*100).toFixed(1) + '%';
  } catch(e){}
  finally { if (!sujo){ PUB.cofre = cofreAntes; PUB.gz = gzAntes; } }
}

      const f = arq.files && arq.files[0]; if (!f) return;
      lerCampos();
      d.html = await f.text(); d.arquivo = f.name;
      if (!d.titulo.trim()){
        const m = d.html.match(/<(?:title)[^>]*>([\s\S]*?)<\/title>/i);
        d.titulo = (m && m[1].trim()) || f.name.replace(/\.html?$/i,'').replace(/[-_]+/g,' ');
      }

      modal = null; marcarSujo(); som('ok'); render();
    });
  }
}

/* ---------- Cliques ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch (act){
    case 'olho': { const i = el.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; el.setAttribute('aria-label', i.type === 'password' ? 'Mostrar senha' : 'Esconder senha'); break; }
    case 'sair': sair(); break;
    case 'sair-mesmo': sujo = false; modal = null; sair(); break;
    case 'som': somLigado = !somLigado; LS.set('portal_som', somLigado ? '1' : '0'); som('clique'); render(); break;
    case 'aba': aba = v; window.scrollTo(0,0); render(); break;
    case 'tema': filtro.tema = v; som('clique'); viewAtividades($('#conteudo')); break;
    case 'abrir': { const a = V.atividades.find(x => x.id === id); if (a){ som('clique'); abrirPlayer(a, false); } break; }
    case 'voltar': fecharPlayer(); break;
    case 'telacheia': { const p = $('#player'); if (p && p.requestFullscreen) p.requestFullscreen().catch(() => toast('Tela cheia não está disponível neste aparelho.')); else toast('Tela cheia não está disponível neste aparelho.'); break; }
    case 'feita': {
      const f = feitas();
      if (f.has(id)){ f.delete(id); el.setAttribute('aria-pressed','false'); el.textContent = 'Marcar como feita'; }
      else { f.add(id); el.setAttribute('aria-pressed','true'); el.textContent = '✓ Feita!'; som('feita'); confete(el); }
      salvarFeitas(f); break;
    }
    case 'nova': modal = { tipo:'ativ', dados:{ titulo:'', desc:'', tema:filtro.tema || '', emoji:'🧩', cor:CORES[V.atividades.length % CORES.length], html:'', colar:false } }; renderModal(); setTimeout(() => { const a = $('#atArq'); if (a) a.parentElement.focus(); }, 30); break;
    case 'editar': { const a = V.atividades.find(x => x.id === id); modal = { tipo:'ativ', id, dados:Object.assign({ colar:false, arquivo:'' }, clone(a)) }; renderModal(); break; }
    case 'fechar-modal': modal = null; renderModal(); break;
    case 'emoji': modal.ler && modal.ler(); modal.dados.emoji = v; renderModal(); break;
    case 'cor': modal.ler && modal.ler(); modal.dados.cor = v; renderModal(); break;
    case 'modo-colar': modal.ler && modal.ler(); modal.dados.colar = true; renderModal(); break;
    case 'modo-arquivo': modal.ler && modal.ler(); modal.dados.colar = false; renderModal(); break;
    case 'testar': {
      modal.ler && modal.ler();
      if (!modal.dados.html.trim()){ const err = $('#atErro'); err.textContent = 'Primeiro escolha o arquivo ou cole o código.'; err.hidden = false; break; }
      abrirPlayer({ id:'teste', titulo:modal.dados.titulo || 'Atividade', html:modal.dados.html }, true); break;
    }
    case 'excluir':
      if (!modal.confirmar){ modal.ler && modal.ler(); modal.confirmar = true; renderModal(); break; }
      V.atividades = V.atividades.filter(a => a.id !== modal.id); modal = null; marcarSujo(); toast('Atividade excluída.'); render(); break;
    case 'gerar': { const i = $('#' + el.dataset.alvo); if (i) i.value = gerarSenha(); break; }
    case 'nova-senha': modal = { tipo:'senha', id }; renderModal(); break;
    case 'remover': {
      if (el.dataset.confirmar !== '1'){ el.dataset.confirmar = '1'; el.classList.add('confirmar'); el.textContent = 'Confirmar'; setTimeout(() => { if (el.isConnected){ el.dataset.confirmar = ''; el.classList.remove('confirmar'); el.textContent = 'Remover'; } }, 4000); break; }
      const u = V.usuarios.find(x => x.id === id);
      if (u.adm && V.usuarios.filter(x => x.adm).length <= 1){ toast('O portal precisa de pelo menos um administrador.', 'erro'); break; }
      V.usuarios = V.usuarios.filter(x => x.id !== id); PUB.contas = PUB.contas.filter(x => x.id !== id);
      credsNovas = credsNovas.filter(x => x.login !== u.login);
      marcarSujo(); toast(u.nome + ' foi removido.'); render(); break;
    }
    case 'copiar-creds': {
      const txt = credsNovas.map(x => x.nome + ' | usuário: ' + x.login + ' | senha: ' + x.senha).join('\n');
      try { await navigator.clipboard.writeText(txt); toast('Lista copiada.'); }
      catch(x){ const r = document.createRange(); r.selectNodeContents(el.closest('.creds').querySelector('ul')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Lista selecionada. Use Ctrl+C para copiar.'); }
      break;
    }
    case 'baixar-ativacao': {
      modal = null; const ok = await publicar();
      if (ok) toast('Arquivo index.html baixado. Agora envie esse arquivo ao Claude na conversa.');
      break;
    }
    case 'ativar-correio':
      await ativarCorreio();
      if (MODO_ARQUIVO){ const ok = await publicar(); if (ok) toast('Pronto! Agora envie ao Claude o arquivo index.html que foi baixado.'); }
      else render();
      break;
    case 'publicar': await publicar(); break;
    case 'descartar': await descartar(); break;
  }
});
window.addEventListener('popstate', () => { if ($('#player')) fecharPlayer(true); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#player')) fecharPlayer();
  else if (modal){ modal = null; renderModal(); }
});

/* ---------- Início ---------- */
(async () => {
  if (!(window.crypto && crypto.subtle)){
    $('#app').innerHTML = '<div class="tela-entrada gutter"><main class="ficha"><h1>Navegador sem suporte</h1><p style="margin-top:10px">Abra o portal em um navegador atualizado (Chrome, Edge, Safari ou Firefox).</p></main></div>';
    return;
  }
  await retomarSessao();
  if (ME && ME.adm && V && !V.correioPriv && MODO_ARQUIVO){ await ativarCorreio(); modal = { tipo:'ativado' }; }
  render();
  const flash = SS.get('portal_flash');
  if (flash){ SS.del('portal_flash'); if (ME) setTimeout(() => toast(flash), 300); }
})();
})();
</script>
