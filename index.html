<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamefica Ação Matemática</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="description" content="Jogos e atividades de Matemática – Prof. Dr. Haroldo Aleixo de Lima Junior">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Mesmo visual do portal: caderno quadriculado e jogos como post-its coloridos */
  :root{
    --chao:#f3f6fb; --quadro:rgba(47,91,170,.11); --cartao:#ffffff; --cartao2:#f7f9fd;
    --tinta:#1d2b53; --tinta2:#55627f; --linha:#d9e1ee;
    --marca:#ffd23f; --marca-borda:#e0ad00; --coral:#d9442f; --verde:#12865f; --azul:#2f63d6;
    --sombra:0 1px 0 rgba(29,43,83,.06),0 10px 26px -14px rgba(29,43,83,.32);
    --n-amarelo:#ffe27a; --n-coral:#ffb4a6; --n-verde:#a6e4c6; --n-azul:#b9d4ff; --n-lilas:#d8c9ff; --n-laranja:#ffc88a;
    --tinta-nota:#1d2b53; --hero-bg:#1d2b53; --hero-bg2:#2f4aa0;
    --f-display:'Fredoka','Nunito',system-ui,sans-serif;
    --f-corpo:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background-color:var(--chao);background-image:linear-gradient(var(--quadro) 1px,transparent 1px),linear-gradient(90deg,var(--quadro) 1px,transparent 1px);background-size:26px 26px;color:var(--tinta);font-family:var(--f-corpo);font-size:16px;line-height:1.5;min-height:100vh}
  h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  header.topo{background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg2));color:#fff;padding:22px 16px 26px}
  header.topo .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  header.topo h1{font-size:clamp(1.4rem,3.4vw,2rem)}
  header.topo h1 span{color:var(--marca)}
  header.topo small{display:block;opacity:.8;font-weight:700;margin-top:2px}
  #usuario{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
  #usuario button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:none}

  main{max-width:1080px;margin:0 auto;padding:20px 16px}
  .card{background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--sombra)}
  h2{font-size:1.45rem;margin-bottom:4px}
  .sub{color:var(--tinta2);margin:0 0 14px;font-weight:600}
  .passo{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--f-display);font-size:1.15rem;font-weight:600}
  .passo b{width:30px;height:30px;border-radius:50%;background:var(--marca);border:2px solid var(--marca-borda);display:grid;place-items:center;font-size:.95rem;color:var(--tinta-nota)}
  label{display:block;font-weight:800;font-size:.92rem;margin:10px 0 5px}
  input,select{width:100%;padding:12px 13px;border:2px solid var(--linha);border-radius:12px;font-size:1rem;background:var(--cartao)}
  input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(47,99,214,.18)}

  button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:2px solid var(--marca-borda);border-radius:12px;padding:10px 16px;font-weight:800;background:var(--marca);color:var(--tinta-nota);box-shadow:0 3px 0 var(--marca-borda);transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--marca-borda)}
  button.sec{background:var(--cartao);border-color:var(--linha);color:var(--tinta);box-shadow:none}
  button.perigo{background:transparent;border-color:var(--coral);color:var(--coral);box-shadow:none}
  button.peq{padding:7px 12px;font-size:.9rem;border-radius:10px}
  button.grande{padding:13px 22px;font-size:1.08rem}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

  /* Cartões dos jogos (iguais aos do portal) */
  .grade-jogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
  .cartao-jogo{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);color:var(--tinta);box-shadow:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
  .cartao-jogo:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:var(--sombra)}
  .cartao-jogo:active{transform:translateY(-1px);box-shadow:var(--sombra)}
  .cartao-jogo[aria-pressed="true"]{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul),var(--sombra);transform:translateY(-3px)}
  .nota{background:var(--n,var(--n-amarelo));height:100px;display:grid;place-items:center;font-size:50px;position:relative;width:100%}
  .nota .tema{position:absolute;left:10px;top:9px;font-size:12px;font-weight:800;color:var(--tinta-nota);background:rgba(255,255,255,.65);padding:2px 9px;border-radius:99px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-corpo)}
  .nota .emoji{transition:transform .25s;line-height:1}
  .cartao-jogo:hover .emoji{transform:scale(1.15) rotate(-6deg)}
  .marcado{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:none;place-items:center;font-size:16px;font-weight:900;font-family:var(--f-corpo);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .cartao-jogo[aria-pressed="true"] .marcado{display:grid}
  .corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;width:100%}
  .corpo h3{font-size:1.08rem}
  .corpo p{margin:0;color:var(--tinta2);font-size:.88rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .escolhido{display:flex;align-items:center;gap:12px;background:var(--cartao2);border:2px dashed var(--linha);border-radius:12px;padding:10px 14px;margin-top:4px;font-weight:700}
  .escolhido .mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;background:var(--n,var(--n-amarelo));flex-shrink:0}

  /* Minhas atividades */
  .grade-ativ{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .ativ{display:flex;flex-direction:column;border:2px solid var(--linha);border-radius:var(--r);overflow:hidden;background:var(--cartao)}
  .ativ .topo-ativ{background:var(--n,var(--n-amarelo));display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--tinta-nota)}
  .ativ .topo-ativ .em{font-size:34px;line-height:1}
  .ativ .topo-ativ h3{font-size:1.12rem}
  .ativ .topo-ativ small{display:block;font-weight:800;opacity:.75}
  .ativ .meio{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor;color:var(--tinta2)}
  .tag.aberta{color:var(--verde)}
  .tag.enc{color:var(--coral)}
  .qr-caixa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border:2px dashed var(--linha);border-radius:12px;background:#fff}
  .qr-caixa canvas{width:100%;max-width:200px;height:auto;image-rendering:pixelated}
  .qr-caixa small{color:#444;font-weight:800;text-align:center}
  .link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--cartao2);border:1.5px solid var(--linha);border-radius:10px;padding:7px 10px;word-break:break-all}

  .msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:.95rem;font-weight:700}
  .msg.erro{background:#fde3df;color:#8f2416}
  .msg.ok{background:#d9f3e7;color:#0b5c40}
  .msg.info{background:#e3ecff;color:#1f3f91}
  .tabs{display:flex;gap:8px;margin:10px 0 6px}
  .tabs button{flex:1;background:var(--cartao);border-color:var(--linha);box-shadow:none;color:var(--tinta)}
  .tabs button.ativo{background:var(--marca);border-color:var(--marca-borda);box-shadow:0 3px 0 var(--marca-borda)}
  .tabela-wrap{overflow-x:auto;border:2px solid var(--linha);border-radius:12px}
  table{border-collapse:collapse;width:100%;min-width:560px;background:var(--cartao)}
  th,td{padding:9px 10px;border-bottom:1px solid var(--linha);text-align:left;font-size:.93rem}
  th{background:var(--cartao2);font-weight:800;position:sticky;top:0}
  td.n,th.n{text-align:center}
  .nota-alta{color:var(--verde);font-weight:800}
  .nota-baixa{color:var(--coral);font-weight:800}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .resumo div{background:var(--n-amarelo);color:var(--tinta-nota);border-radius:12px;padding:10px 14px;font-weight:700}
  .resumo div:nth-child(2){background:var(--n-azul)}
  .resumo div:nth-child(3){background:var(--n-verde)}
  .resumo b{display:block;font-size:1.6rem;font-family:var(--f-display)}
  footer{max-width:1080px;margin:0 auto;padding:6px 16px 30px;color:var(--tinta2);font-size:.88rem;text-align:center;font-weight:600}
  .vazio{color:var(--tinta2);padding:6px 0;font-weight:600}
  @media (max-width:560px){
    .grade-jogos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .nota{height:78px;font-size:38px}
    .nota .tema{font-size:10.5px;left:6px;top:6px;padding:1px 7px}
    .corpo{padding:9px 10px 11px}
    .corpo h3{font-size:.95rem}
    .corpo p{font-size:.78rem}
    .marcado{width:24px;height:24px;font-size:13px;right:6px;top:6px}
    .card{padding:16px}
    .grade-ativ{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- Site único: navegação, login, jogos, administração ---------- */
  nav.abas{max-width:1080px;margin:-18px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2}
  nav.abas button{background:var(--cartao);border-color:var(--linha);box-shadow:var(--sombra);color:var(--tinta);font-size:1rem}
  nav.abas button[aria-current="page"]{background:var(--marca);border-color:var(--marca-borda);box-shadow:0 3px 0 var(--marca-borda)}
  .ola{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
  .secao-titulo{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-family:var(--f-display);font-size:1.3rem;font-weight:600}
  .login-box{max-width:440px;margin:26px auto}
  .login-box .nota{height:120px;font-size:58px;border-radius:12px 12px 0 0}
  .login-box .card{padding:0;overflow:hidden}
  .login-box form{padding:18px 20px 22px}
  .campo-senha{position:relative}
  .campo-senha input{padding-right:48px}
  .olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent!important;border:0!important;box-shadow:none!important;padding:6px 8px;font-size:1.1rem}
  .sub2{color:var(--tinta2);font-size:.9rem;font-weight:600;margin-top:10px}
  .aviso-saida{background:#fff4d6;border:2px solid #f0c75e;color:#6b4a00;border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}

  /* Player do jogo */
  .player{position:fixed;inset:0;z-index:50;background:#0b1430;display:flex;flex-direction:column}
  .player-barra{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--hero-bg);color:#fff;padding-top:max(8px,env(safe-area-inset-top))}
  .player-barra h2{font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player-barra button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none}
  .player iframe{flex:1;width:100%;border:0;background:#fff}
  .player .carregando{flex:1;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;text-align:center;padding:20px}

  /* Administração */
  .contas{display:grid;gap:12px}
  .conta{border:2px solid var(--linha);border-radius:var(--r);padding:12px 14px;background:var(--cartao)}
  .conta.bloq{background:var(--cartao2)}
  .conta-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .conta-topo h3{font-size:1.08rem}
  .conta-topo .login{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;color:var(--tinta2)}
  .bolinha{width:11px;height:11px;border-radius:50%;background:#b8c2d6;display:inline-block}
  .bolinha.on{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.2)}
  .conta-info{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--tinta2);font-size:.88rem;font-weight:600;margin:6px 0 8px}
  .alerta{background:#fff1ec;border:1.5px solid #f3b3a2;color:#8f2416;border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700;margin-bottom:8px}
  .editar-conta{background:var(--cartao2);border:2px dashed var(--linha);border-radius:12px;padding:10px 12px;margin-top:10px}
  .historico{margin-top:8px;font-size:.85rem}
  .historico div{padding:3px 0;border-bottom:1px dashed var(--linha)}
  .entrega{background:#eaf7f0;border:2px solid #9bd8b8;border-radius:12px;padding:12px 14px;margin-top:12px;white-space:pre-wrap;font-weight:700;color:#0b5c40}
  .tag.venc{color:#b45309}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <div><h1>🎮 Gamefica <span>Ação Matemática</span></h1><small>Jogos e atividades de Matemática para aprender brincando</small></div>
  <div id="usuario"></div>
</div></header>
<nav class="abas" id="abas" hidden></nav>
<main id="app"><div class="card">Carregando…</div></main>
<footer>Desenvolvido por <i>Prof. Dr. Haroldo Aleixo de Lima Junior</i></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js"></script>
<script src="turma/supabase-config.js"></script>
<script src="turma/jogos.js?v=20261030b"></script>
<script src="turma/qr.js"></script>
<script>
(function(){
'use strict';

var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var FUNCOES = window.SUPABASE_URL + '/functions/v1/';
var DOMINIO = 'contas.gamefica.example.com';
var app = document.getElementById('app');
var usuarioBox = document.getElementById('usuario');
var abasBox = document.getElementById('abas');

var sessao = null;      // sessão do Supabase (token)
var perfil = null;      // {nome, papel, login, validade}
var SID = null;         // identificador desta sessão (um aparelho por vez)
var aba = 'jogos';
var vigia = null;
var atividades = [], contagem = {}, abertaId = null, modo = 'melhor', resultadosBrutos = [];
var jogoEscolhido = null;
var contas = [], buscaContas = '';

/* ---------- utilidades ---------- */
function el(tag, props){
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v === null || v === undefined || v === false) return;
    if(k === 'class') e.className = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else e.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    [].concat(arguments[i]).forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function fmtNota(n){ return Number(n).toFixed(1).replace('.', ','); }
function fmtTempo(s){ if(s === null || s === undefined) return '—'; return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function fmtData(iso){ return iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—'; }
function fmtDia(d){ if(!d) return ''; var p = String(d).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function slug(t){ return (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'relatorio'; }
function linkDe(a){ return new URL('turma/jogar.html?a=' + encodeURIComponent(a.codigo), location.href).href; }
function msg(tipo, texto){ return el('div', {class:'msg ' + tipo, role:'alert'}, texto); }
function corDe(id){ var j = window.JOGOS[id]; return '--n:var(--n-' + ((j && j.cor) || 'amarelo') + ')'; }
function baixar(blob, nome){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.append(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copiar(texto, botao){
  function ok(){ var t = botao.textContent; botao.textContent = '✔ Copiado!'; setTimeout(function(){ botao.textContent = t; }, 1600); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok, function(){ window.prompt('Copie:', texto); });
  } else { window.prompt('Copie:', texto); }
}
function chaveAluno(r){
  return (r.aluno_nome || '').toLowerCase().replace(/\s+/g,' ').trim() + '|' + (r.aluno_turma || '').toLowerCase().trim();
}
function guardar(k, v){ try{ if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function ler(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function novoSid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function aparelho(){
  var ua = navigator.userAgent || '';
  var so = /Android/i.test(ua) ? 'Android' : /iPhone|iPad|iPod/i.test(ua) ? 'iPhone/iPad' : /Windows/i.test(ua) ? 'Windows'
         : /Mac OS X|Macintosh/i.test(ua) ? 'Mac' : /CrOS/i.test(ua) ? 'Chromebook' : /Linux/i.test(ua) ? 'Linux' : 'Outro';
  var nav = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Firefox\//.test(ua) ? 'Firefox'
          : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
  return so + ' · ' + nav;
}
function emailDe(login){ login = String(login || '').trim().toLowerCase(); return login.indexOf('@') >= 0 ? login : login + '@' + DOMINIO; }
function gerarSenha(){
  var letras = 'abcdefghjkmnpqrstuvwxyz', nums = '23456789', a = new Uint32Array(8); crypto.getRandomValues(a);
  var s = ''; for(var i = 0; i < 5; i++) s += letras[a[i] % letras.length];
  for(i = 5; i < 8; i++) s += nums[a[i] % nums.length];
  return s.charAt(0).toUpperCase() + s.slice(1);
}
async function chamarFuncao(nome, corpo){
  var r = await fetch(FUNCOES + nome, {method:'POST', headers:{
    'Content-Type':'application/json', 'apikey': window.SUPABASE_KEY,
    'Authorization':'Bearer ' + (sessao ? sessao.access_token : '')}, body: JSON.stringify(corpo)});
  return r;
}

/* ---------- sessão única ---------- */
var MOTIVOS = {
  outro_aparelho: '🔒 Sua conta foi aberta em outro aparelho, então esta tela foi desconectada. Cada login só pode ser usado em um aparelho por vez.',
  encerrada: 'Sua sessão foi encerrada. Entre de novo.',
  bloqueada: '⛔ Sua conta está bloqueada. Fale com o Prof. Haroldo.',
  vencida: '⏰ Seu acesso venceu. Fale com o Prof. Haroldo para renovar.',

/* ---------- notas e relatórios ---------- */
function consolidar(brutos){
  var porAluno = {};
  brutos.forEach(function(r){
    var k = chaveAluno(r);
    var g = porAluno[k] || (porAluno[k] = {nome: r.aluno_nome, turma: r.aluno_turma || '', tentativas: 0, escolhido: null});
    g.tentativas++;
    var c = g.escolhido;
    if(modo === 'ultima'){
      if(!c || r.enviado_em >= c.enviado_em) g.escolhido = r;
    } else {
      if(!c || Number(r.nota) > Number(c.nota) || (Number(r.nota) === Number(c.nota) && r.pontos > c.pontos)) g.escolhido = r;
    }
  });
  return Object.keys(porAluno).map(function(k){ return porAluno[k]; })
    .sort(function(a, b){
      var ea = a.escolhido, eb = b.escolhido;
      return (Number(eb.nota) - Number(ea.nota)) || ((eb.pontos || 0) - (ea.pontos || 0)) ||
        ((ea.tempo_segundos || 0) - (eb.tempo_segundos || 0)) || a.nome.localeCompare(b.nome, 'pt-BR');
    });
}

            el('td', {class:'n'}, e.acertos + '/' + e.total_questoes),
            el('td', {class:'n ' + (n >= 6 ? 'nota-alta' : 'nota-baixa')}, fmtNota(n)),
            el('td', {class:'n'}, l.tentativas), el('td', {class:'n'}, fmtTempo(e.tempo_segundos)),
            el('td', {}, fmtData(e.enviado_em)));
        }))));

  area.replaceChildren(el('div', {class:'card'},
    el('h2', {}, '📊 Notas: ' + a.titulo),
    el('div', {class:'resumo'},
      el('div', {}, el('b', {}, linhas.length), 'alunos'),
      el('div', {}, el('b', {}, linhas.length ? fmtNota(media) : '—'), 'média da turma'),
      el('div', {}, el('b', {}, linhas.length ? acima + '/' + linhas.length : '—'), 'com nota ≥ 6,0')),
    el('div', {class:'linha', style:'margin-bottom:10px'},
      selModo,
      el('button', {class:'peq', onclick: function(){ baixarWord(a, linhas, media); }, disabled: linhas.length ? null : 'disabled'}, '📄 Baixar Word (.docx)'),
      el('button', {class:'peq sec', onclick: function(){ baixarCsv(a, linhas); }, disabled: linhas.length ? null : 'disabled'}, '📑 Baixar Excel (.csv)'),
      el('button', {class:'peq', onclick: function(){ mostrarResultados(a.id, false, true); }}, '🔄 Atualizar notas')),
    el('div', {class:'linha', style:'margin-bottom:10px;align-items:center'},
      el('label', {style:'margin:0;font-weight:600;display:flex;gap:6px;align-items:center'},
        el('input', {type:'checkbox', style:'width:auto', checked: autoNotas ? 'checked' : null, onchange: function(){ autoNotas = this.checked; agendarAtualizacaoNotas(a); }}),
        'Atualizar sozinho a cada 15 s'),
      el('small', {class:'vazio', style:'margin:0'}, 'Ordem: da maior para a menor nota' + (ultimaAtualizacao ? ' · atualizado às ' + ultimaAtualizacao.toLocaleTimeString('pt-BR') : ''))),
    corpo,
    el('p', {class:'vazio'}, 'A nota vai de 0 a 10 e é calculada pelo servidor: acertos ÷ total de questões × 10.')
  ));
  agendarAtualizacaoNotas(a);
}

/* ---------- exportações ---------- */
function baixarCsv(a, linhas){
  function cel(v){
    var t = String(v === null || v === undefined ? '' : v);
    if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // evita que o Excel trate o texto como fórmula
    return '"' + t.replace(/"/g, '""') + '"';
  }
  var rows = [['Nº','Aluno','Turma','Acertos','Total de questões','Nota','Tentativas','Tempo','Enviado em']];
  linhas.forEach(function(l, i){
    var e = l.escolhido;
    rows.push([i + 1, l.nome, l.turma, e.acertos, e.total_questoes, fmtNota(e.nota), l.tentativas, fmtTempo(e.tempo_segundos), fmtData(e.enviado_em)]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(cel).join(';'); }).join('\r\n');
  baixar(new Blob([csv], {type:'text/csv;charset=utf-8'}), 'resultados-' + slug(a.titulo) + '.csv');
}

async function baixarWord(a, linhas, media){
  if(!window.docx){ window.alert('A biblioteca do Word não carregou. Verifique a internet e tente de novo.'); return; }
  var D = window.docx;
  var nomeProf = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  var larguras = [600, 3500, 1300, 1300, 1100, 1838];   // soma = 9638 (A4 com margens de 2 cm)
  var borda = {style: D.BorderStyle.SINGLE, size: 4, color: 'B8C0D9'};
  var bordas = {top:borda, bottom:borda, left:borda, right:borda};

  function celula(texto, i, opt){
    opt = opt || {};
    return new D.TableCell({
      width: {size: larguras[i], type: D.WidthType.DXA},
      borders: bordas,
      shading: opt.cabecalho ? {fill:'E3E7FA', type: D.ShadingType.CLEAR, color:'auto'} : undefined,
      margins: {top: 70, bottom: 70, left: 100, right: 100},
      children: [new D.Paragraph({
        alignment: opt.centro ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
        children: [new D.TextRun({text: String(texto), bold: !!opt.cabecalho || !!opt.negrito, size: 22, font: 'Arial'})]
      })]
    });
  }
  function par(rotulo, valor){
    return new D.Paragraph({spacing:{after:60}, children:[
      new D.TextRun({text: rotulo + ': ', bold:true, size:23, font:'Arial'}),
      new D.TextRun({text: String(valor), size:23, font:'Arial'})]});
  }

  var cab = new D.TableRow({tableHeader:true, children:[
    celula('Nº',0,{cabecalho:true,centro:true}), celula('Aluno',1,{cabecalho:true}), celula('Turma',2,{cabecalho:true}),
    celula('Acertos',3,{cabecalho:true,centro:true}), celula('Nota',4,{cabecalho:true,centro:true}), celula('Tentativas',5,{cabecalho:true,centro:true})]});
  var corpo = linhas.map(function(l, i){
    var e = l.escolhido;
    return new D.TableRow({cantSplit:true, children:[
      celula(i+1,0,{centro:true}), celula(l.nome,1), celula(l.turma || '—',2),
      celula(e.acertos + '/' + e.total_questoes,3,{centro:true}), celula(fmtNota(e.nota),4,{centro:true,negrito:true}),
      celula(l.tentativas,5,{centro:true})]});
  });

  var doc = new D.Document({
    creator: nomeProf, title: 'Relatório – ' + a.titulo,
    sections: [{
      properties: {page: {size: {width: 11906, height: 16838}, margin: {top:1134, bottom:1134, left:1134, right:1134}}},
      children: [
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:80}, children:[
          new D.TextRun({text:'Relatório da Atividade', bold:true, size:36, font:'Arial'})]}),
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:240}, children:[
          new D.TextRun({text: a.titulo, size:28, font:'Arial', color:'4F46E5'})]}),
        par('Jogo', (window.JOGOS[a.jogo] ? window.JOGOS[a.jogo].nome : a.jogo)),
        par('Turma', a.turma || '—'),
        par('Professor(a)', nomeProf),
        par('Gerado em', new Date().toLocaleString('pt-BR', {dateStyle:'long', timeStyle:'short'})),
        par('Critério da nota', modo === 'ultima' ? 'última tentativa de cada aluno' : 'melhor tentativa de cada aluno'),
        par('Alunos que participaram', linhas.length),
        par('Média da turma', fmtNota(media)),
        new D.Paragraph({spacing:{before:200, after:120}, children:[]}),
        new D.Table({width:{size:9638, type:D.WidthType.DXA}, columnWidths: larguras, rows:[cab].concat(corpo)}),
        new D.Paragraph({spacing:{before:200}, children:[
          new D.TextRun({text:'Nota de 0 a 10 = acertos ÷ total de questões × 10. Gerado pelo portal Gamefica Ação Matemática.', italics:true, size:18, font:'Arial', color:'5D6785'})]})
      ]
    }]
  });
  var blob = await D.Packer.toBlob(doc);
  baixar(blob, 'relatorio-' + slug(a.titulo) + '.docx');
}



/* ---------- aba Administração ---------- */
async function carregarContas(){
  var r = await sb.rpc('admin_listar');
  contas = r.error ? [] : r.data;
  if(r.error) contas.erro = r.error.message;
}
function situacao(c){
  if(!c.ativo) return {t:'⛔ Bloqueada', cls:'enc'};
  if(c.validade && c.validade < hojeISO()) return {t:'⏰ Vencida', cls:'venc'};
  return {t:'● Ativa', cls:'aberta'};
}
function desenharAdmin(){
  var nome = el('input', {type:'text', id:'cNome', maxlength:'80', placeholder:'Ex.: Maria da Silva'});
  var login = el('input', {type:'text', id:'cLogin', maxlength:'80', autocapitalize:'none', spellcheck:'false', placeholder:'Ex.: maria.silva'});
  var senha = el('input', {type:'text', id:'cSenha', maxlength:'60', value: gerarSenha()});
  var validade = el('input', {type:'date', id:'cVal'});
  var obs = el('input', {type:'text', id:'cObs', maxlength:'300', placeholder:'Ex.: pagou via Pix em 26/10 (opcional)'});
  var aviso = el('div'), botao = el('button', {type:'submit', class:'grande'}, '➕ Criar conta');
  nome.addEventListener('input', function(){
    if(login.dataset.mexeu) return;
    var p = nome.value.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().split(/\s+/).filter(Boolean);
    login.value = p.length ? (p.length > 1 ? p[0] + '.' + p[p.length - 1] : p[0]) : '';
  });
  login.addEventListener('input', function(){ login.dataset.mexeu = '1'; });
  var form = el('form', {onsubmit: async function(ev){
    ev.preventDefault(); aviso.replaceChildren(); botao.disabled = true;
    var corpo = {acao:'criar', nome: nome.value.trim(), login: login.value.trim().toLowerCase(), senha: senha.value, validade: validade.value || null};
    var r = await chamarFuncao('admin-contas', corpo);
    var d = await r.json().catch(function(){ return {}; });
    botao.disabled = false;
    if(!r.ok){ aviso.append(msg('erro', d.erro || 'Não foi possível criar a conta.')); return; }
    if(obs.value.trim()) await sb.rpc('admin_atualizar', {p_id: d.id, p_nome: corpo.nome, p_ativo: true, p_validade: corpo.validade, p_observacao: obs.value.trim()});
    var texto = 'Olá, ' + corpo.nome.split(' ')[0] + '! Seu acesso ao Gamefica Ação Matemática está pronto 🎮\n\n' +
      '🌐 Site: ' + location.origin + location.pathname.replace(/[^/]*$/, '') + '\n👤 Login: ' + corpo.login + '\n🔑 Senha: ' + corpo.senha + '\n' +
      (corpo.validade ? '📅 Válido até: ' + fmtDia(corpo.validade) + '\n' : '') +
      '\nAtenção: o login funciona em um aparelho por vez. Não compartilhe sua senha.';
    var btn = el('button', {class:'peq', type:'button'}, '📋 Copiar mensagem');
    btn.addEventListener('click', function(){ copiar(texto, btn); });
    await carregarContas(); desenharAdmin();
    var area = document.getElementById('entrega');
    if(area){ area.replaceChildren(msg('ok', '✅ Conta criada! Envie estes dados para a pessoa:'), el('div', {class:'entrega'}, texto), el('div', {style:'margin-top:8px'}, btn)); area.scrollIntoView({behavior:'smooth', block:'center'}); }
  }},
    el('div', {class:'duas'},
      el('div', {}, el('label', {for:'cNome'}, 'Nome da pessoa'), nome),
      el('div', {}, el('label', {for:'cLogin'}, 'Login'), login)),
    el('div', {class:'duas'},
      el('div', {}, el('label', {for:'cSenha'}, 'Senha'), el('div', {class:'linha', style:'flex-wrap:nowrap'}, senha,
        el('button', {type:'button', class:'peq sec', onclick: function(){ senha.value = gerarSenha(); }, title:'Gerar outra senha'}, '🎲'))),
      el('div', {}, el('label', {for:'cVal'}, 'Acesso válido até (opcional)'), validade)),
    el('label', {for:'cObs'}, 'Observação (só você vê)'), obs,
    el('div', {style:'margin-top:14px'}, botao), aviso);

  var lista = contas.filter(function(c){
    var b = buscaContas.toLowerCase();
    return !b || (c.nome || '').toLowerCase().indexOf(b) >= 0 || (c.login || '').indexOf(b) >= 0 || (c.email || '').indexOf(b) >= 0;
  });
  var ativos = contas.filter(function(c){ return situacao(c).cls === 'aberta'; }).length;
  var online = contas.filter(function(c){ return c.online; }).length;
  var busca = el('input', {type:'search', placeholder:'🔎 Procurar por nome ou login', value: buscaContas, oninput: function(){
    buscaContas = this.value; var pos = this.selectionStart; desenharAdmin(); var b = document.getElementById('buscaC'); if(b){ b.focus(); try{ b.setSelectionRange(pos, pos); }catch(e){} }
  }, id:'buscaC'});

  app.replaceChildren(
    el('div', {class:'card'}, el('h2', {}, '👥 Contas'),
      contas.erro ? msg('erro', 'Erro ao carregar: ' + contas.erro) : null,
      el('div', {class:'resumo'},
        el('div', {}, el('b', {}, contas.length), 'contas'),
        el('div', {}, el('b', {}, ativos), 'com acesso liberado'),
        el('div', {}, el('b', {}, online), 'usando agora')),
      el('div', {class:'linha', style:'margin-bottom:12px'}, busca,
        el('button', {class:'peq sec', onclick: async function(){ await carregarContas(); desenharAdmin(); }}, '🔄 Atualizar')),
      lista.length ? el('div', {class:'contas'}, lista.map(cartaoConta)) : el('p', {class:'vazio'}, 'Nenhuma conta encontrada.')),
    el('div', {class:'card'}, el('h2', {}, '➕ Nova conta para quem comprou'),
      el('p', {class:'sub'}, 'Crie o login e a senha e envie para a pessoa. Cada login funciona em um aparelho por vez.'), form, el('div', {id:'entrega'})));
}
function cartaoConta(c){
  var s = situacao(c), eu = c.id === sessao.user.id, extra = el('div');
  var loginMostrado = c.login || c.email;
  async function atualizar(campos){
    var p = Object.assign({p_id: c.id, p_nome: c.nome, p_ativo: c.ativo, p_validade: c.validade, p_observacao: c.observacao || ''}, campos);
    var r = await sb.rpc('admin_atualizar', p);
    if(r.error){ extra.replaceChildren(msg('erro', r.error.message)); return false; }
    await carregarContas(); desenharAdmin(); return true;
  }
  var botoes = [];
  if(!eu) botoes.push(el('button', {class:'peq ' + (c.ativo ? 'perigo' : ''), onclick: function(){ atualizar({p_ativo: !c.ativo}); }}, c.ativo ? '⛔ Bloquear' : '✅ Desbloquear'));
  botoes.push(el('button', {class:'peq sec', onclick: function(){
    var n = el('input', {type:'text', value: c.nome, maxlength:'80'});
    var v = el('input', {type:'date', value: c.validade || ''});
    var o = el('input', {type:'text', value: c.observacao || '', maxlength:'300'});
    extra.replaceChildren(el('div', {class:'editar-conta'},
      el('div', {class:'duas'}, el('div', {}, el('label', {}, 'Nome'), n), el('div', {}, el('label', {}, 'Acesso válido até (vazio = sem prazo)'), v)),
      el('label', {}, 'Observação'), o,
      el('div', {class:'linha', style:'margin-top:10px'},
        el('button', {class:'peq', onclick: function(){ atualizar({p_nome: n.value.trim() || c.nome, p_validade: v.value || null, p_observacao: o.value}); }}, '💾 Salvar'),
        el('button', {class:'peq sec', onclick: function(){ extra.replaceChildren(); }}, 'Cancelar'))));
  }}, '✏️ Editar'));
  if(!eu) botoes.push(el('button', {class:'peq sec', onclick: async function(){
    var nova = gerarSenha();
    if(!window.confirm('Trocar a senha de ' + c.nome + '? A pessoa será desconectada e só entrará com a senha nova.')) return;
    var r = await chamarFuncao('admin-contas', {acao:'senha', id: c.id, senha: nova});
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok){ extra.replaceChildren(msg('erro', d.erro || 'Erro ao trocar a senha.')); return; }
    var texto = 'Sua nova senha do Gamefica Ação Matemática:\n👤 Login: ' + loginMostrado + '\n🔑 Senha: ' + nova;
    var btn = el('button', {class:'peq'}, '📋 Copiar'); btn.addEventListener('click', function(){ copiar(texto, btn); });
    extra.replaceChildren(msg('ok', 'Senha trocada. Envie para a pessoa:'), el('div', {class:'entrega'}, texto), el('div', {style:'margin-top:8px'}, btn));
  }}, '🔑 Nova senha'));
  if(!eu && c.online) botoes.push(el('button', {class:'peq sec', onclick: async function(){
    var r = await sb.rpc('admin_derrubar', {p_id: c.id});
    if(!r.error){ await carregarContas(); desenharAdmin(); }
  }}, '⏏ Desconectar agora'));
  botoes.push(el('button', {class:'peq sec', onclick: async function(){
    var r = await sb.rpc('admin_historico', {p_id: c.id});
    if(r.error){ extra.replaceChildren(msg('erro', r.error.message)); return; }
    var nomes = {entrou:'🟢 Entrou', derrubado:'🔁 Desconectado (entrou em outro aparelho)', saiu:'⚪ Saiu'};
    extra.replaceChildren(el('div', {class:'historico'},
      r.data.length ? r.data.map(function(h){ return el('div', {}, fmtData(h.quando) + ' — ' + (nomes[h.evento] || h.evento) + (h.aparelho ? ' · ' + h.aparelho : '')); }) : el('div', {}, 'Nenhum acesso ainda.')));
  }}, '📜 Acessos'));
  if(!eu) botoes.push(el('button', {class:'peq perigo', onclick: async function(){
    if(!window.confirm('Excluir a conta de ' + c.nome + ' (' + loginMostrado + ')? A pessoa perde o acesso e as atividades de turma dela. Isso não pode ser desfeito.')) return;
    var r = await chamarFuncao('admin-contas', {acao:'excluir', id: c.id});
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok){ extra.replaceChildren(msg('erro', d.erro || 'Erro ao excluir.')); return; }
    await carregarContas(); desenharAdmin();
  }}, '🗑 Excluir'));

  return el('div', {class:'conta' + (c.ativo ? '' : ' bloq')},
    el('div', {class:'conta-topo'},
      el('span', {class:'bolinha' + (c.online ? ' on' : ''), title: c.online ? 'Usando agora' : 'Fora do site'}),
      el('h3', {}, c.nome || '(sem nome)'), el('span', {class:'login'}, loginMostrado),
      c.papel === 'admin' ? el('span', {class:'tag'}, '🛡️ Administrador') : null,
      el('span', {class:'tag ' + s.cls}, s.t)),
    el('div', {class:'conta-info'},
      el('span', {}, c.online ? '🟢 Usando agora' : '🕒 Último acesso: ' + fmtData(c.ultimo_acesso)),
      c.aparelho ? el('span', {}, '💻 ' + c.aparelho) : null,
      c.validade ? el('span', {}, '📅 Até ' + fmtDia(c.validade)) : el('span', {}, '📅 Sem prazo'),
      c.observacao ? el('span', {}, '📝 ' + c.observacao) : null),
    (c.trocas_30d >= 3 || c.aparelhos_30d >= 4) ? el('div', {class:'alerta'},
      '⚠️ Possível compartilhamento: ' + c.trocas_30d + ' desconexões por login em outro aparelho e ' + c.aparelhos_30d + ' aparelhos diferentes nos últimos 30 dias.') : null,
    el('div', {class:'linha'}, botoes), extra);
}

iniciar();
})();
</script>
