<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Professor · Gamefica Ação Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Mesmo visual do portal: caderno quadriculado e jogos como post-its coloridos */
  :root{
    --chao:#f3f6fb; --quadro:rgba(47,91,170,.11); --cartao:#ffffff; --cartao2:#f7f9fd;
    --tinta:#1d2b53; --tinta2:#55627f; --linha:#d9e1ee;
    --marca:#ffd23f; --marca-borda:#e0ad00; --coral:#d9442f; --verde:#12865f; --azul:#2f63d6;
    --sombra:0 1px 0 rgba(29,43,83,.06),0 10px 26px -14px rgba(29,43,83,.32);
    --n-amarelo:#ffe27a; --n-coral:#ffb4a6; --n-verde:#a6e4c6; --n-azul:#b9d4ff; --n-lilas:#d8c9ff; --n-laranja:#ffc88a;
    --tinta-nota:#1d2b53; --hero-bg:#1d2b53; --hero-bg2:#2f4aa0;
    --f-display:'Fredoka','Nunito',system-ui,sans-serif;
    --f-corpo:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background-color:var(--chao);background-image:linear-gradient(var(--quadro) 1px,transparent 1px),linear-gradient(90deg,var(--quadro) 1px,transparent 1px);background-size:26px 26px;color:var(--tinta);font-family:var(--f-corpo);font-size:16px;line-height:1.5;min-height:100vh}
  h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  header.topo{background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg2));color:#fff;padding:22px 16px 26px}
  header.topo .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  header.topo h1{font-size:clamp(1.4rem,3.4vw,2rem)}
  header.topo h1 span{color:var(--marca)}
  header.topo small{display:block;opacity:.8;font-weight:700;margin-top:2px}
  #usuario{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
  #usuario button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:none}

  main{max-width:1080px;margin:0 auto;padding:20px 16px}
  .card{background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--sombra)}
  h2{font-size:1.45rem;margin-bottom:4px}
  .sub{color:var(--tinta2);margin:0 0 14px;font-weight:600}
  .passo{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--f-display);font-size:1.15rem;font-weight:600}
  .passo b{width:30px;height:30px;border-radius:50%;background:var(--marca);border:2px solid var(--marca-borda);display:grid;place-items:center;font-size:.95rem;color:var(--tinta-nota)}
  label{display:block;font-weight:800;font-size:.92rem;margin:10px 0 5px}
  input,select{width:100%;padding:12px 13px;border:2px solid var(--linha);border-radius:12px;font-size:1rem;background:var(--cartao)}
  input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(47,99,214,.18)}

  button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:2px solid var(--marca-borda);border-radius:12px;padding:10px 16px;font-weight:800;background:var(--marca);color:var(--tinta-nota);box-shadow:0 3px 0 var(--marca-borda);transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--marca-borda)}
  button.sec{background:var(--cartao);border-color:var(--linha);color:var(--tinta);box-shadow:none}
  button.perigo{background:transparent;border-color:var(--coral);color:var(--coral);box-shadow:none}
  button.peq{padding:7px 12px;font-size:.9rem;border-radius:10px}
  button.grande{padding:13px 22px;font-size:1.08rem}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

  /* Cartões dos jogos (iguais aos do portal) */
  .grade-jogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
  .cartao-jogo{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);color:var(--tinta);box-shadow:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
  .cartao-jogo:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:var(--sombra)}
  .cartao-jogo:active{transform:translateY(-1px);box-shadow:var(--sombra)}
  .cartao-jogo[aria-pressed="true"]{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul),var(--sombra);transform:translateY(-3px)}
  .nota{background:var(--n,var(--n-amarelo));height:100px;display:grid;place-items:center;font-size:50px;position:relative;width:100%}
  .nota .tema{position:absolute;left:10px;top:9px;font-size:12px;font-weight:800;color:var(--tinta-nota);background:rgba(255,255,255,.65);padding:2px 9px;border-radius:99px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-corpo)}
  .nota .emoji{transition:transform .25s;line-height:1}
  .cartao-jogo:hover .emoji{transform:scale(1.15) rotate(-6deg)}
  .marcado{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:none;place-items:center;font-size:16px;font-weight:900;font-family:var(--f-corpo);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .cartao-jogo[aria-pressed="true"] .marcado{display:grid}
  .corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;width:100%}
  .corpo h3{font-size:1.08rem}
  .corpo p{margin:0;color:var(--tinta2);font-size:.88rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .escolhido{display:flex;align-items:center;gap:12px;background:var(--cartao2);border:2px dashed var(--linha);border-radius:12px;padding:10px 14px;margin-top:4px;font-weight:700}
  .escolhido .mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;background:var(--n,var(--n-amarelo));flex-shrink:0}

  /* Minhas atividades */
  .grade-ativ{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .ativ{display:flex;flex-direction:column;border:2px solid var(--linha);border-radius:var(--r);overflow:hidden;background:var(--cartao)}
  .ativ .topo-ativ{background:var(--n,var(--n-amarelo));display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--tinta-nota)}
  .ativ .topo-ativ .em{font-size:34px;line-height:1}
  .ativ .topo-ativ h3{font-size:1.12rem}
  .ativ .topo-ativ small{display:block;font-weight:800;opacity:.75}
  .ativ .meio{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor;color:var(--tinta2)}
  .tag.aberta{color:var(--verde)}
  .tag.enc{color:var(--coral)}
  .link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--cartao2);border:1.5px solid var(--linha);border-radius:10px;padding:7px 10px;word-break:break-all}

  .msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:.95rem;font-weight:700}
  .msg.erro{background:#fde3df;color:#8f2416}
  .msg.ok{background:#d9f3e7;color:#0b5c40}
  .msg.info{background:#e3ecff;color:#1f3f91}
  .tabs{display:flex;gap:8px;margin:10px 0 6px}
  .tabs button{flex:1;background:var(--cartao);border-color:var(--linha);box-shadow:none;color:var(--tinta)}
  .tabs button.ativo{background:var(--marca);border-color:var(--marca-borda);box-shadow:0 3px 0 var(--marca-borda)}
  .tabela-wrap{overflow-x:auto;border:2px solid var(--linha);border-radius:12px}
  table{border-collapse:collapse;width:100%;min-width:560px;background:var(--cartao)}
  th,td{padding:9px 10px;border-bottom:1px solid var(--linha);text-align:left;font-size:.93rem}
  th{background:var(--cartao2);font-weight:800;position:sticky;top:0}
  td.n,th.n{text-align:center}
  .nota-alta{color:var(--verde);font-weight:800}
  .nota-baixa{color:var(--coral);font-weight:800}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .resumo div{background:var(--n-amarelo);color:var(--tinta-nota);border-radius:12px;padding:10px 14px;font-weight:700}
  .resumo div:nth-child(2){background:var(--n-azul)}
  .resumo div:nth-child(3){background:var(--n-verde)}
  .resumo b{display:block;font-size:1.6rem;font-family:var(--f-display)}
  footer{max-width:1080px;margin:0 auto;padding:6px 16px 30px;color:var(--tinta2);font-size:.88rem;text-align:center;font-weight:600}
  .vazio{color:var(--tinta2);padding:6px 0;font-weight:600}
  @media (max-width:560px){
    .grade-jogos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .nota{height:78px;font-size:38px}
    .nota .tema{font-size:10.5px;left:6px;top:6px;padding:1px 7px}
    .corpo{padding:9px 10px 11px}
    .corpo h3{font-size:.95rem}
    .corpo p{font-size:.78rem}
    .marcado{width:24px;height:24px;font-size:13px;right:6px;top:6px}
    .card{padding:16px}
    .grade-ativ{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <div><h1>🎮 Gamefica <span>Ação Matemática</span></h1><small>Painel do professor · escolha um jogo, gere o link e acompanhe as notas</small></div>
  <div id="usuario"></div>
</div></header>
<main id="app"><div class="card">Carregando…</div></main>
<footer>Desenvolvido por <i>Prof. Dr. Haroldo Aleixo de Lima Junior</i></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js"></script>
<script src="supabase-config.js"></script>
<script src="jogos.js"></script>
<script>
(function(){
'use strict';

var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var app = document.getElementById('app');
var usuarioBox = document.getElementById('usuario');

var sessao = null;
var atividades = [];
var contagem = {};      // atividade_id -> número de alunos diferentes
var abertaId = null;    // atividade com resultados abertos
var modo = 'melhor';    // 'melhor' ou 'ultima'
var resultadosBrutos = [];
var modoLogin = 'entrar';

/* ---------- utilidades ---------- */
function el(tag, props){
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v === null || v === undefined || v === false) return;
    if(k === 'class') e.className = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else e.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    kids.forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function fmtNota(n){ return Number(n).toFixed(1).replace('.', ','); }
function fmtTempo(s){ if(s === null || s === undefined) return '—'; return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function fmtData(iso){ return new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}); }
function slug(t){ return (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'relatorio'; }
function linkDe(a){ return new URL('jogar.html?a=' + encodeURIComponent(a.codigo), location.href).href; }
function msg(tipo, texto){ return el('div', {class:'msg ' + tipo, role:'alert'}, texto); }
function baixar(blob, nome){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.append(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copiar(texto, botao){
  function ok(){ var t = botao.textContent; botao.textContent = '✔ Copiado!'; setTimeout(function(){ botao.textContent = t; }, 1600); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok, function(){ window.prompt('Copie o link:', texto); });
  } else { window.prompt('Copie o link:', texto); }
}
function chaveAluno(r){
  return (r.aluno_nome || '').toLowerCase().replace(/\s+/g,' ').trim() + '|' + (r.aluno_turma || '').toLowerCase().trim();
}

/* ---------- início ---------- */
async function iniciar(){
  var r = await sb.auth.getSession();
  sessao = r.data.session;
  sb.auth.onAuthStateChange(function(evt, s){
    var mudou = (!!s) !== (!!sessao);
    sessao = s;
    if(mudou) telaInicial();
  });
  telaInicial();
}
async function telaInicial(){
  usuarioBox.replaceChildren();
  if(!sessao){ desenharLogin(); return; }
  var nome = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  usuarioBox.append(
    el('span', {}, '👤 ' + nome + '  '),
    el('button', {class:'sec peq', onclick: async function(){ await sb.auth.signOut(); }}, 'Sair')
  );
  await carregarAtividades();
  desenharPainel();
}

/* ---------- login ---------- */
function desenharLogin(msgNode){
  var email = el('input', {type:'email', id:'email', autocomplete:'email', placeholder:'seuemail@exemplo.com'});
  var senha = el('input', {type:'password', id:'senha', autocomplete: modoLogin === 'entrar' ? 'current-password' : 'new-password', placeholder:'mínimo 8 caracteres'});
  var nome  = el('input', {type:'text', id:'nome', autocomplete:'name', placeholder:'Como aparecerá nos relatórios'});
  var aviso = el('div');
  var botao = el('button', {type:'submit'}, modoLogin === 'entrar' ? 'Entrar' : 'Criar conta');

  var form = el('form', {onsubmit: async function(ev){
    ev.preventDefault();
    aviso.replaceChildren(); botao.disabled = true;
    try{
      if(modoLogin === 'entrar'){
        var r = await sb.auth.signInWithPassword({email: email.value.trim(), password: senha.value});
        if(r.error) throw r.error;
      } else {
        if(senha.value.length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.');
        if(nome.value.trim().length < 2) throw new Error('Informe seu nome.');
        var r2 = await sb.auth.signUp({
          email: email.value.trim(), password: senha.value,
          options: { data: {nome: nome.value.trim()}, emailRedirectTo: location.origin + location.pathname }
        });
        if(r2.error) throw r2.error;
        if(!r2.data.session){
          aviso.append(msg('ok', 'Conta criada! Enviamos uma mensagem de confirmação para o seu e-mail. Clique no link dela e depois volte aqui para entrar.'));
        }
      }
    }catch(e){
      var t = String(e.message || e);
      if(/invalid login/i.test(t)) t = 'E-mail ou senha incorretos.';
      else if(/already registered/i.test(t)) t = 'Este e-mail já tem conta. Use a aba "Entrar".';
      else if(/not confirmed/i.test(t)) t = 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada e o spam).';
      aviso.append(msg('erro', t));
    }
    botao.disabled = false;
  }},
    modoLogin === 'criar' ? [el('label', {for:'nome'}, 'Seu nome'), nome] : null,
    el('label', {for:'email'}, 'E-mail'), email,
    el('label', {for:'senha'}, 'Senha'), senha,
    el('div', {style:'margin-top:14px'}, botao),
    aviso
  );

  app.replaceChildren(el('div', {class:'card', style:'max-width:460px;margin:20px auto'},
    el('h2', {}, '🔑 Acesso do professor'),
    el('div', {class:'tabs'},
      el('button', {class: modoLogin === 'entrar' ? 'ativo' : '', onclick: function(){ modoLogin = 'entrar'; desenharLogin(); }}, 'Entrar'),
      el('button', {class: modoLogin === 'criar' ? 'ativo' : '', onclick: function(){ modoLogin = 'criar'; desenharLogin(); }}, 'Criar conta')
    ),
    form,
    el('p', {class:'vazio'}, 'Os alunos não precisam de conta: eles só abrem o link da atividade.')
  ));
}

/* ---------- atividades ---------- */
async function carregarAtividades(){
  var a = await sb.from('atividades').select('*').order('criada_em', {ascending:false});
  atividades = a.error ? [] : a.data;
  var r = await sb.from('resultados').select('atividade_id,aluno_nome,aluno_turma').limit(5000);
  contagem = {};
  if(!r.error){
    var vistos = {};
    r.data.forEach(function(x){
      var k = x.atividade_id + '#' + chaveAluno(x);
      if(!vistos[k]){ vistos[k] = 1; contagem[x.atividade_id] = (contagem[x.atividade_id] || 0) + 1; }
    });
  }
}

function corDe(id){ var j = window.JOGOS[id]; return '--n:var(--n-' + ((j && j.cor) || 'amarelo') + ')'; }
var jogoEscolhido = null;

function desenharPainel(){
  var ids = Object.keys(window.JOGOS);
  if(!jogoEscolhido || !window.JOGOS[jogoEscolhido]) jogoEscolhido = null;
  var titulo = el('input', {type:'text', id:'titulo', maxlength:'120', placeholder:'Ex.: Porcentagem – lista 1'});
  var turma  = el('input', {type:'text', id:'turma', maxlength:'40', placeholder:'Ex.: 3ª A (opcional)'});
  var aviso  = el('div');
  var botao  = el('button', {type:'submit', class:'grande'}, '🔗 Criar atividade e gerar link');
  var resumoEscolha = el('div');
  var tituloAuto = '';

  function mostrarEscolha(){
    resumoEscolha.replaceChildren();
    if(!jogoEscolhido){ resumoEscolha.append(el('p', {class:'vazio'}, '👆 Toque em um jogo acima para escolher.')); return; }
    var j = window.JOGOS[jogoEscolhido];
    resumoEscolha.append(el('div', {class:'escolhido'},
      el('span', {class:'mini', style: corDe(jogoEscolhido)}, j.emoji),
      el('span', {}, 'Jogo escolhido: ', el('b', {}, j.nome))));
  }
  var cartoes = ids.map(function(id){
    var j = window.JOGOS[id];
    var c = el('button', {type:'button', class:'cartao-jogo', style: corDe(id), 'aria-pressed': String(id === jogoEscolhido),
      onclick: function(){
        jogoEscolhido = id;
        cartoes.forEach(function(x){ x.setAttribute('aria-pressed', String(x === c)); });
        if(!titulo.value.trim() || titulo.value === tituloAuto){ tituloAuto = j.nome; titulo.value = j.nome; }
        mostrarEscolha(); aviso.replaceChildren();
      }},
      el('div', {class:'nota'}, j.tema ? el('span', {class:'tema'}, j.tema) : null, el('span', {class:'emoji', 'aria-hidden':'true'}, j.emoji), el('span', {class:'marcado', 'aria-hidden':'true'}, '✓')),
      el('div', {class:'corpo'}, el('h3', {}, j.nome), j.desc ? el('p', {}, j.desc) : null));
    return c;
  });

  var form = el('form', {onsubmit: async function(ev){
    ev.preventDefault(); aviso.replaceChildren();
    if(!jogoEscolhido){ aviso.append(msg('erro', 'Escolha um jogo tocando em um dos cartões.')); return; }
    var t = titulo.value.trim();
    if(!t){ aviso.append(msg('erro', 'Dê um nome à atividade.')); titulo.focus(); return; }
    botao.disabled = true;
    var r = await sb.from('atividades').insert({jogo: jogoEscolhido, titulo: t, turma: turma.value.trim() || null}).select().single();
    botao.disabled = false;
    if(r.error){ aviso.append(msg('erro', 'Não foi possível criar: ' + r.error.message)); return; }
    jogoEscolhido = null;
    await carregarAtividades(); abertaId = null; desenharPainel();
    var lista = document.getElementById('minhas'); if(lista) lista.scrollIntoView({behavior:'smooth', block:'start'});
  }},
    el('div', {class:'passo'}, el('b', {}, '1'), 'Escolha o jogo'),
    el('div', {class:'grade-jogos'}, cartoes),
    el('div', {class:'passo'}, el('b', {}, '2'), 'Dê um nome e (se quiser) a turma'),
    resumoEscolha,
    el('div', {class:'duas', style:'margin-top:6px'},
      el('div', {}, el('label', {for:'titulo'}, 'Nome da atividade'), titulo),
      el('div', {}, el('label', {for:'turma'}, 'Turma'), turma)),
    el('div', {class:'passo'}, el('b', {}, '3'), 'Gere o link e mande aos alunos'),
    botao,
    aviso
  );
  mostrarEscolha();

  var lista = atividades.length === 0
    ? el('p', {class:'vazio'}, 'Você ainda não criou nenhuma atividade. Escolha um jogo acima para criar a primeira.')
    : el('div', {class:'grade-ativ'}, atividades.map(cartaoAtividade));

  app.replaceChildren(
    el('div', {class:'card'}, el('h2', {}, '✨ Nova atividade'),
      el('p', {class:'sub'}, 'Os alunos abrem o link em qualquer lugar (celular ou computador) e a nota chega aqui sozinha.'), form),
    el('div', {class:'card', id:'minhas'}, el('h2', {}, '📚 Minhas atividades'),
      el('p', {class:'sub'}, 'Copie o link e cole na Sala do Futuro, no Classroom, no Moodle ou no WhatsApp.'), lista),
    el('div', {id:'area-resultados'})
  );
  if(abertaId) mostrarResultados(abertaId);
}

function cartaoAtividade(a){
  var link = linkDe(a);
  var j = window.JOGOS[a.jogo] || {nome: a.jogo, emoji: '🎮'};
  var btnCopiar = el('button', {class:'peq'}, '📋 Copiar link');
  btnCopiar.addEventListener('click', function(){ copiar(link, btnCopiar); });
  var alunos = contagem[a.id] || 0;
  return el('div', {class:'ativ'},
    el('div', {class:'topo-ativ', style: corDe(a.jogo)},
      el('span', {class:'em', 'aria-hidden':'true'}, j.emoji),
      el('div', {}, el('h3', {}, a.titulo), el('small', {}, j.nome))),
    el('div', {class:'meio'},
      el('div', {class:'tags'},
        a.turma ? el('span', {class:'tag'}, a.turma) : null,
        el('span', {class:'tag ' + (a.ativa ? 'aberta' : 'enc')}, a.ativa ? '● Aberta' : '⏸ Encerrada'),
        el('span', {class:'tag'}, '👥 ' + alunos + (alunos === 1 ? ' aluno' : ' alunos'))),
      el('div', {class:'link'}, link),
      el('div', {class:'linha'},
        btnCopiar,
        el('button', {class:'peq sec', onclick: function(){ abertaId = a.id; mostrarResultados(a.id, true); }}, '📊 Ver notas'),
        el('button', {class:'peq sec', onclick: async function(){
          var r = await sb.from('atividades').update({ativa: !a.ativa}).eq('id', a.id);
          if(!r.error){ await carregarAtividades(); desenharPainel(); }
        }}, a.ativa ? '⏸ Encerrar' : '▶ Reabrir'),
        el('button', {class:'peq perigo', onclick: async function(){
          if(!window.confirm('Excluir "' + a.titulo + '" e todos os resultados dela? Isso não pode ser desfeito.')) return;
          var r = await sb.from('atividades').delete().eq('id', a.id);
          if(!r.error){ if(abertaId === a.id) abertaId = null; await carregarAtividades(); desenharPainel(); }
        }}, '🗑 Excluir'))));
}

/* ---------- resultados ---------- */
function consolidar(brutos){
  var porAluno = {};
  brutos.forEach(function(r){
    var k = chaveAluno(r);
    var g = porAluno[k] || (porAluno[k] = {nome: r.aluno_nome, turma: r.aluno_turma || '', tentativas: 0, escolhido: null});
    g.tentativas++;
    var c = g.escolhido;
    if(modo === 'ultima'){
      if(!c || r.enviado_em >= c.enviado_em) g.escolhido = r;
    } else {
      if(!c || Number(r.nota) > Number(c.nota) || (Number(r.nota) === Number(c.nota) && r.pontos > c.pontos)) g.escolhido = r;
    }
  });
  return Object.keys(porAluno).map(function(k){ return porAluno[k]; })
    .sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
}

async function mostrarResultados(id, rolar){
  var area = document.getElementById('area-resultados');
  var a = atividades.find(function(x){ return x.id === id; });
  if(!a){ area.replaceChildren(); return; }
  area.replaceChildren(el('div', {class:'card'}, 'Carregando resultados…'));
  var r = await sb.from('resultados').select('*').eq('atividade_id', id).order('enviado_em', {ascending:true}).limit(5000);
  if(r.error){ area.replaceChildren(el('div', {class:'card'}, msg('erro', 'Erro ao carregar: ' + r.error.message))); return; }
  resultadosBrutos = r.data;
  desenharResultados(a);
  if(rolar) area.scrollIntoView({behavior:'smooth', block:'start'});
}

function desenharResultados(a){
  var area = document.getElementById('area-resultados');
  var linhas = consolidar(resultadosBrutos);
  var notas = linhas.map(function(l){ return Number(l.escolhido.nota); });
  var media = notas.length ? notas.reduce(function(s, n){ return s + n; }, 0) / notas.length : 0;
  var acima = notas.filter(function(n){ return n >= 6; }).length;

  var selModo = el('select', {style:'width:auto', onchange: function(){ modo = this.value; desenharResultados(a); }},
    el('option', {value:'melhor'}, 'Contar a melhor tentativa'),
    el('option', {value:'ultima'}, 'Contar a última tentativa'));
  selModo.value = modo;

  var corpo = linhas.length === 0
    ? el('p', {class:'vazio'}, 'Nenhum aluno enviou resultado ainda. Cole o link da atividade na Sala do Futuro ou no Moodle.')
    : el('div', {class:'tabela-wrap'}, el('table', {},
        el('thead', {}, el('tr', {},
          el('th', {class:'n'}, 'Nº'), el('th', {}, 'Aluno'), el('th', {}, 'Turma'),
          el('th', {class:'n'}, 'Acertos'), el('th', {class:'n'}, 'Nota'),
          el('th', {class:'n'}, 'Tentativas'), el('th', {class:'n'}, 'Tempo'), el('th', {}, 'Enviado em'))),
        el('tbody', {}, linhas.map(function(l, i){
          var e = l.escolhido, n = Number(e.nota);
          return el('tr', {},
            el('td', {class:'n'}, i + 1), el('td', {}, l.nome), el('td', {}, l.turma || '—'),
            el('td', {class:'n'}, e.acertos + '/' + e.total_questoes),
            el('td', {class:'n ' + (n >= 6 ? 'nota-alta' : 'nota-baixa')}, fmtNota(n)),
            el('td', {class:'n'}, l.tentativas), el('td', {class:'n'}, fmtTempo(e.tempo_segundos)),
            el('td', {}, fmtData(e.enviado_em)));
        }))));

  area.replaceChildren(el('div', {class:'card'},
    el('h2', {}, '📊 Notas: ' + a.titulo),
    el('div', {class:'resumo'},
      el('div', {}, el('b', {}, linhas.length), 'alunos'),
      el('div', {}, el('b', {}, linhas.length ? fmtNota(media) : '—'), 'média da turma'),
      el('div', {}, el('b', {}, linhas.length ? acima + '/' + linhas.length : '—'), 'com nota ≥ 6,0')),
    el('div', {class:'linha', style:'margin-bottom:10px'},
      selModo,
      el('button', {class:'peq', onclick: function(){ baixarWord(a, linhas, media); }, disabled: linhas.length ? null : 'disabled'}, '📄 Baixar Word (.docx)'),
      el('button', {class:'peq sec', onclick: function(){ baixarCsv(a, linhas); }, disabled: linhas.length ? null : 'disabled'}, '📑 Baixar Excel (.csv)'),
      el('button', {class:'peq sec', onclick: function(){ mostrarResultados(a.id); }}, '🔄 Atualizar')),
    corpo,
    el('p', {class:'vazio'}, 'A nota vai de 0 a 10 e é calculada pelo servidor: acertos ÷ total de questões × 10.')
  ));
}

/* ---------- exportações ---------- */
function baixarCsv(a, linhas){
  function cel(v){
    var t = String(v === null || v === undefined ? '' : v);
    if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // evita que o Excel trate o texto como fórmula
    return '"' + t.replace(/"/g, '""') + '"';
  }
  var rows = [['Nº','Aluno','Turma','Acertos','Total de questões','Nota','Tentativas','Tempo','Enviado em']];
  linhas.forEach(function(l, i){
    var e = l.escolhido;
    rows.push([i + 1, l.nome, l.turma, e.acertos, e.total_questoes, fmtNota(e.nota), l.tentativas, fmtTempo(e.tempo_segundos), fmtData(e.enviado_em)]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(cel).join(';'); }).join('\r\n');
  baixar(new Blob([csv], {type:'text/csv;charset=utf-8'}), 'resultados-' + slug(a.titulo) + '.csv');
}

async function baixarWord(a, linhas, media){
  if(!window.docx){ window.alert('A biblioteca do Word não carregou. Verifique a internet e tente de novo.'); return; }
  var D = window.docx;
  var nomeProf = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  var larguras = [600, 3500, 1300, 1300, 1100, 1838];   // soma = 9638 (A4 com margens de 2 cm)
  var borda = {style: D.BorderStyle.SINGLE, size: 4, color: 'B8C0D9'};
  var bordas = {top:borda, bottom:borda, left:borda, right:borda};

  function celula(texto, i, opt){
    opt = opt || {};
    return new D.TableCell({
      width: {size: larguras[i], type: D.WidthType.DXA},
      borders: bordas,
      shading: opt.cabecalho ? {fill:'E3E7FA', type: D.ShadingType.CLEAR, color:'auto'} : undefined,
      margins: {top: 70, bottom: 70, left: 100, right: 100},
      children: [new D.Paragraph({
        alignment: opt.centro ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
        children: [new D.TextRun({text: String(texto), bold: !!opt.cabecalho || !!opt.negrito, size: 22, font: 'Arial'})]
      })]
    });
  }
  function par(rotulo, valor){
    return new D.Paragraph({spacing:{after:60}, children:[
      new D.TextRun({text: rotulo + ': ', bold:true, size:23, font:'Arial'}),
      new D.TextRun({text: String(valor), size:23, font:'Arial'})]});
  }

  var cab = new D.TableRow({tableHeader:true, children:[
    celula('Nº',0,{cabecalho:true,centro:true}), celula('Aluno',1,{cabecalho:true}), celula('Turma',2,{cabecalho:true}),
    celula('Acertos',3,{cabecalho:true,centro:true}), celula('Nota',4,{cabecalho:true,centro:true}), celula('Tentativas',5,{cabecalho:true,centro:true})]});
  var corpo = linhas.map(function(l, i){
    var e = l.escolhido;
    return new D.TableRow({cantSplit:true, children:[
      celula(i+1,0,{centro:true}), celula(l.nome,1), celula(l.turma || '—',2),
      celula(e.acertos + '/' + e.total_questoes,3,{centro:true}), celula(fmtNota(e.nota),4,{centro:true,negrito:true}),
      celula(l.tentativas,5,{centro:true})]});
  });

  var doc = new D.Document({
    creator: nomeProf, title: 'Relatório – ' + a.titulo,
    sections: [{
      properties: {page: {size: {width: 11906, height: 16838}, margin: {top:1134, bottom:1134, left:1134, right:1134}}},
      children: [
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:80}, children:[
          new D.TextRun({text:'Relatório da Atividade', bold:true, size:36, font:'Arial'})]}),
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:240}, children:[
          new D.TextRun({text: a.titulo, size:28, font:'Arial', color:'4F46E5'})]}),
        par('Jogo', (window.JOGOS[a.jogo] ? window.JOGOS[a.jogo].nome : a.jogo)),
        par('Turma', a.turma || '—'),
        par('Professor(a)', nomeProf),
        par('Gerado em', new Date().toLocaleString('pt-BR', {dateStyle:'long', timeStyle:'short'})),
        par('Critério da nota', modo === 'ultima' ? 'última tentativa de cada aluno' : 'melhor tentativa de cada aluno'),
        par('Alunos que participaram', linhas.length),
        par('Média da turma', fmtNota(media)),
        new D.Paragraph({spacing:{before:200, after:120}, children:[]}),
        new D.Table({width:{size:9638, type:D.WidthType.DXA}, columnWidths: larguras, rows:[cab].concat(corpo)}),
        new D.Paragraph({spacing:{before:200}, children:[
          new D.TextRun({text:'Nota de 0 a 10 = acertos ÷ total de questões × 10. Gerado pelo portal Gamefica Ação Matemática.', italics:true, size:18, font:'Arial', color:'5D6785'})]})
      ]
    }]
  });
  var blob = await D.Packer.toBlob(doc);
  baixar(blob, 'relatorio-' + slug(a.titulo) + '.docx');
}

iniciar();
})();
</script>
