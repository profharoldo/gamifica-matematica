<!doctype html>
<html lang="pt-BR">
<head>
<script src="ponte-portal.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show da Proporção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Palco de TV: pergunta no centro, escada de prêmios à direita (no celular vira uma faixa). Tema único escuro, de propósito. */
:root{
  color-scheme: dark;
  --stage:#0a1238; --stage2:#14226a; --panel:#17287a; --panel2:#1d3290; --line:#3249b0;
  --gold:#ffc93c; --gold-ink:#2e1f00; --ink:#f2f4ff; --muted:#b3bfee;
  --ok:#2ed47a; --bad:#ff5468; --sky:#58c6ff;
  --display:'Bungee', 'Arial Black', Impact, sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-size:17px; line-height:1.45;
  background: radial-gradient(1200px 600px at 50% -10%, var(--stage2), transparent 70%), var(--stage);
  padding-inline:16px; padding-block:16px 32px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{font-family:var(--display);font-size:clamp(18px,3.4vw,26px);letter-spacing:.02em;line-height:1}
.logo b{color:var(--gold);font-weight:400}
.top{flex-wrap:wrap}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;transition:opacity .15s}
.iconbtn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.iconbtn.fs{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:800;z-index:40;max-width:calc(100% - 32px);text-align:center}
.listen{background:var(--panel);border:2px solid var(--sky);color:var(--sky);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.host{display:inline-block;margin-bottom:10px;font-weight:900;color:var(--gold);font-size:clamp(18px,2.6vw,22px);min-height:1.4em}

/* Animação do apresentador */
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.2);color:var(--ink)}100%{transform:scale(1)}}
.host .mic{display:inline-block}
.host.speaking .mic{animation:pulseMic .5s infinite}

@media (max-width:560px){.lbl{display:none}}

/* fração no formato de livro */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15;font-size:.92em}
.fr>span{padding:0 .25em}
.fr>span:first-child{border-bottom:2px solid currentColor}

/* ---------- INÍCIO ---------- */
.start{display:grid;gap:20px;max-width:760px;margin:0 auto;text-align:center;padding-top:8px}
.marquee{font-family:var(--display);font-size:clamp(40px,10vw,84px);line-height:.95;color:var(--gold);
  text-shadow:0 4px 0 #b77d00,0 10px 30px rgba(255,201,60,.35);text-wrap:balance}
.marquee small{display:block;font-size:.38em;color:var(--ink);text-shadow:none;margin-bottom:8px;letter-spacing:.08em}
.sub{color:var(--muted);font-weight:700;font-size:18px;margin:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left}
.rule{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.rule h3{margin:0 0 4px;font-size:16px;color:var(--gold)}
.rule p{margin:0;font-size:15px;color:var(--muted)}
.big{font-family:var(--display);font-size:22px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:18px;
  padding:16px 30px;box-shadow:0 6px 0 #b77d00;transition:transform .1s; margin-top:10px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b77d00}
.toggle{display:inline-flex;align-items:center;gap:10px;justify-content:center;font-weight:700;color:var(--muted);flex-wrap:wrap}
.tsel{font:inherit;font-weight:800;color:var(--ink);background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:8px 12px}
.teacher{background:rgba(88,198,255,.1);border:2px dashed var(--sky);border-radius:16px;padding:14px 16px;text-align:left;font-size:15px}
.teacher b{color:var(--sky)}
.teacher ul{margin:6px 0 0;padding-left:20px}

/* Nome do Jogador */
.name-input-group { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.name-input-group label { font-size: 18px; font-weight: 800; color: var(--gold); }
.name-input-group input { font: inherit; font-weight: 800; color: var(--ink); background: var(--stage); border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; width: 100%; max-width: 300px; }
.name-input-group input:focus { outline: none; border-color: var(--sky); }

/* ---------- JOGO ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
.strip{display:none;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.chip.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky)}

/* Cronômetro Visual */
.timer-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:200px;justify-content:flex-end}
.timer{font-family:var(--display);font-size:22px;min-width:64px;text-align:center;background:var(--panel);border:3px solid var(--gold);
  border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .6s infinite alternate}
.tbar-bg{flex:1;height:12px;background:var(--stage);border:2px solid var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.tbar-fill{height:100%;background:var(--ok);width:100%;transition:width 1s linear, background-color .3s}
.tbar-fill.low{background:var(--bad)}

.qbox{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--gold);border-radius:22px;
  padding:22px 22px;font-size:clamp(19px,2.6vw,25px);font-weight:800;line-height:1.35;text-wrap:pretty;min-height:120px;
  display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hint{margin-top:12px;background:rgba(88,198,255,.12);border:2px solid var(--sky);border-radius:16px;padding:10px 14px;font-weight:700}
.hint b{color:var(--sky)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:18px;
  padding:12px 14px;font-weight:800;font-size:clamp(17px,2.2vw,21px);min-height:68px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sky)}
.opt .l{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--stage);border:2px solid var(--gold);
  font-family:var(--display);color:var(--gold);font-size:18px}
.opt.sel{border-color:var(--gold);background:#3a3a8a}
.opt.wait{animation:blink .35s infinite alternate}
.opt.right{background:var(--ok);border-color:var(--ok);color:#03250f}
.opt.right .l{background:#03250f;border-color:#03250f}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#2b0007}
.opt.wrong .l{background:#2b0007;border-color:#2b0007}

/* Melhoria no visual das eliminadas */
.opt.gone{opacity:.45;pointer-events:none;background:#0d1645;border-color:#14226a;text-decoration:line-through;color:#5c6b9c}
.opt.gone .l{background:#0d1645;border-color:#14226a;color:#5c6b9c;text-decoration:line-through}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.confirm{font-family:var(--display);font-size:18px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:12px 22px;box-shadow:0 5px 0 #b77d00}
.confirm:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.stop{background:transparent;border:2px solid var(--muted);border-radius:14px;padding:10px 16px;font-weight:800;color:var(--muted)}
.stopask{display:inline-flex;gap:8px;align-items:center;font-weight:800}
.stopask button{border-radius:12px;padding:8px 14px;border:0;font-weight:900}
.yes{background:var(--gold);color:var(--gold-ink)} .no{background:var(--panel);border:2px solid var(--line)!important}
.helps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.help{background:var(--stage);border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;font-weight:800;font-size:14px;line-height:1.2}
.help .ic{display:block;font-size:24px;margin-bottom:4px}
.help small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.help:hover:not(:disabled){border-color:var(--gold)}
.help:disabled{opacity:.3;cursor:not-allowed}

.ladder{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column-reverse;gap:3px;position:sticky;top:12px}
.rung{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rung span:first-child{opacity:.7}
.rung.done{color:var(--ok)}
.rung.now{background:var(--gold);color:var(--gold-ink)}
.rung.now span:first-child{opacity:1}
.rung.top{font-family:var(--display);font-weight:400;font-size:15px}
.rung.sep{border-top:2px dashed var(--line);margin-top:4px;padding-top:7px}

/* Botão moblie para ver prêmios */

.btn-mobile-ladder{display:none; width:100%; margin-top:12px; background:var(--panel); border:2px solid var(--gold); color:var(--gold); border-radius:12px; padding:10px; font-weight:900; text-align:center;}

/* Painel Final do Vencedor */
.winner-panel { background:var(--panel); border:3px solid var(--gold); border-radius:24px; padding:24px; margin-bottom:18px; position:relative; overflow:hidden; }
.winner-panel h2 { font-family:var(--display); font-size:clamp(24px, 5vw, 36px); color:var(--ink); margin:10px 0 0; }
.winner-panel p { color:var(--muted); font-weight:800; margin:10px 0 0; font-size:18px; }
.winner-panel .prize-value { font-family:var(--display); font-size:clamp(36px,8vw,64px); color:var(--gold); line-height:1; text-shadow:0 4px 0 #b77d00; margin-top:8px; }
.m-icon { font-size:64px; line-height:1; animation: bounce 2s infinite; display:inline-block; }
.winner-panel.millionaire { background: linear-gradient(135deg, #4a3600, #111111); border-color: #ffd700; box-shadow: 0 0 50px rgba(255, 215, 0, 0.5); }
.winner-panel.millionaire .m-icon { font-size: 80px; animation: party 0.5s infinite alternate; }

@keyframes bounce { 0%, 100% {transform:translateY(0)} 50% {transform:translateY(-10px)} }
@keyframes party { 0% {transform:scale(1) rotate(-10deg)} 100% {transform:scale(1.2) rotate(10deg)} }


/* ---------- MODAIS ---------- */
.veil{position:fixed;inset:0;background:rgba(4,8,30,.78);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.sheet{width:min(640px,100%);background:var(--panel);border:3px solid var(--gold);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s ease-out;max-height:calc(100vh - 32px);overflow-y:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);margin:0 0 6px;line-height:1.05}
.sheet h2.okc{color:var(--ok)} .sheet h2.badc{color:var(--bad)} .sheet h2.gc{color:var(--gold)}
.lead{margin:0 0 14px;font-weight:700;color:var(--muted)}
.lead b{color:var(--ink)}
.expl{background:var(--stage);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.expl h4{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky)}
.rtwrap{overflow-x:auto}
.rt{border-collapse:separate;border-spacing:0;margin:0 auto;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.rt th{font-size:14px;color:var(--muted);padding:4px 18px;border-bottom:2px solid var(--line)}
.rt td{text-align:center;padding:6px 18px}
.rt td.x{color:var(--gold)}
.rt tfoot td{font-size:28px;line-height:1;padding-top:2px}
.rt tfoot td.up{color:var(--bad)} .rt tfoot td.down{color:var(--ok)}
.kind{text-align:center;font-weight:800;font-size:14px}
.kind.dir{color:var(--ok)} .kind.inv{color:var(--bad)}
.steps{margin:0;padding-left:24px;display:grid;gap:8px;font-weight:700}
.steps li::marker{color:var(--gold);font-weight:900}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.vote{display:grid;gap:10px;margin-top:8px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.vrow .l{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);font-family:var(--display)}
.bar{height:34px;background:var(--stage);border-radius:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--gold));width:0;transition:width .3s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-weight:900;font-size:14px}
.pm{display:flex;gap:6px}
.pm button{width:40px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);font-weight:900;font-size:20px}

/* ---------- FIM E RANKING ---------- */
.end{max-width:720px;margin:0 auto;text-align:center;display:grid;gap:18px}
.prize{font-family:var(--display);font-size:clamp(40px,10vw,76px);color:var(--gold);line-height:1;text-shadow:0 4px 0 #b77d00}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 18px;font-weight:800}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--sky)}
.challenge{text-align:left;background:var(--panel);border:3px dashed var(--gold);border-radius:20px;padding:18px 20px}
.challenge h3{margin:0 0 8px;font-family:var(--display);font-weight:400;color:var(--gold);font-size:20px}
.challenge ol{margin:0;padding-left:22px;display:grid;gap:8px;font-weight:700}
.gab{margin-top:12px;background:var(--stage);border-radius:14px;padding:12px 14px;font-weight:700}
.linkbtn{background:none;border:0;color:var(--sky);font-weight:900;text-decoration:underline;padding:6px 0;margin-top:8px}

.ranking-box { background: var(--panel2); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; text-align: left; }
.ranking-box h3 { font-family: var(--display); color: var(--gold); text-align: center; margin: 0 0 16px; font-size: 24px; }
.ranking-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rank-item { display: flex; justify-content: space-between; align-items: center; background: var(--stage); padding: 10px 16px; border-radius: 12px; font-weight: 800; }
.rank-item.me { background: var(--ok); color: #03250f; }
.rank-pos { width: 30px; font-family: var(--display); font-size: 18px; color: var(--gold); }
.rank-item.me .rank-pos { color: #03250f; }
.rank-name { flex: 1; margin-left: 10px; }
.rank-prize { color: var(--sky); font-variant-numeric: tabular-nums; }
.rank-item.me .rank-prize { color: #03250f; }
.btn-clear { background: transparent; border: 1px solid var(--bad); color: var(--bad); padding: 6px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: block; width: 100%; text-align: center; }

.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes blink{from{background:var(--panel)}to{background:#6a5a10}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}

@media (max-width:820px){
  .game{grid-template-columns:1fr}
  .ladder{display:none}
  .ladder.show-mobile{display:flex; position:static; margin-top:16px;}
  .btn-mobile-ladder{display:block}
  .strip{display:flex}
}
@media (max-width:560px){
  body{font-size:16px}
  .opts{grid-template-columns:1fr}
  .helps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qbox{padding:18px 16px;min-height:96px}
  .rt td,.rt th{padding-inline:10px}
  .timer-wrap{flex-basis:100%; justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- IMPRESSÃO DO RELATÓRIO ---------- */
@media print {
  body { background: white !important; color: black !important; padding: 0; margin: 0; }
  .wrap, #modal, .toast { display: none !important; }
  #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 40px; font-family: sans-serif; color: #000; }
  #print-area h1 { color: #000; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
  #print-area h3 { color: #000; margin-top: 30px; }
  #print-area p, #print-area li { font-size: 16pt; line-height: 1.6; }
}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Show da <b>Proporção</b></div>
    <div class="ctrls">
      <button class="iconbtn" id="bMusic" aria-pressed="true" title="Música de fundo">🎵<span class="lbl"> Música</span></button>
      <button class="iconbtn" id="bVoice" aria-pressed="true" title="Voz do apresentador">🎤<span class="lbl"> Voz</span></button>
      <button class="iconbtn" id="bSfx" aria-pressed="true" title="Efeitos sonoros">🔊<span class="lbl"> Efeitos</span></button>
      <button class="iconbtn fs" id="bFull" title="Tela cheia">⛶<span class="lbl" id="fsLbl"> Tela cheia</span></button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <main id="app"></main>
</div>
<div id="modal"></div>

<script>
// Mantendo a lógica no escopo protegido (IIFE)
(function(){

const f = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;

/* ===================== GERADOR DE PERGUNTAS ===================== */
const N=v=>Number(v).toLocaleString('pt-BR');
const reais=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick1=arr=>arr[Math.floor(Math.random()*arr.length)];
const range=(a,b,s=1)=>{const r=[];for(let v=a;v<=b;v+=s)r.push(v);return r};
const pl=(n,s,p)=>n===1?s:p;

/* ---- situações diretamente proporcionais (b = u · a) ---- */
const DIR=[
 {id:'cadernos',A:'Cadernos',B:'Preço (R$)',u:range(4,15),max:30,fb:reais,rel:'Mais cadernos → pago mais',
  q:(a1,b1,a2)=>`${a1===1?'Um caderno custa':a1+' cadernos custam'} ${reais(b1)}. Quanto custam ${a2} cadernos iguais?`},
 {id:'ovos',A:'Bolos',B:'Ovos',u:[2,3,4],max:12,fb:v=>N(v)+' ovos',rel:'Mais bolos → mais ovos',
  q:(a1,b1,a2)=>`Para fazer ${a1===1?'1 bolo':a1+' bolos'}, Ana usa ${b1} ovos. Quantos ovos ela precisa para fazer ${a2} bolos?`},
 {id:'carro',A:'Tempo (h)',B:'Distância (km)',u:[40,50,60,70,80,90],max:12,fb:v=>N(v)+' km',rel:'Mais tempo andando → mais quilômetros',
  q:(a1,b1,a2)=>`Um carro anda ${N(b1)} km em ${a1===1?'1 hora':a1+' horas'}. Mantendo a mesma velocidade, quantos quilômetros ele anda em ${a2} horas?`},
 {id:'picole',A:'Picolés',B:'Preço (R$)',u:range(2,6),max:30,fb:reais,rel:'Mais picolés → pago mais',

/* ---- utilidades ---- */
function distract(correct,cands){
  const out=[];
  for(const v of cands.concat([correct*2,Math.round(correct/2),correct+10,correct+1,correct+2,correct-1,correct+3]))
    if(Number.isInteger(v)&&v>0&&v!==correct&&!out.includes(v)){out.push(v);if(out.length===3)break}
  return out;
}
function pickCtx(list,pre){const free=list.filter(c=>!S.used.has(pre+c.id));return pick1(free.length?free:list)}

/* ---- regra de três direta ---- */
function genDirect(tier){
  for(let t=0;t<80;t++){
    const c=pickCtx(DIR,'d'), u=pick1(c.u); let a1,a2;
    if(tier<=1){a1=1;a2=rnd(2,5)}
    else if(tier===2){if(Math.random()<.5){a1=1;a2=rnd(3,9)}else{a1=rnd(2,4);a2=a1*2}}
    else if(tier===3){a1=rnd(2,5);a2=a1*rnd(2,4)}
    else if(tier===4){a1=rnd(2,6);do{a2=rnd(a1+1,12)}while(a2%a1===0)}
    else if(tier===5){a1=rnd(3,9);do{a2=rnd(a1+2,20)}while(a2%a1===0)}
    else{a1=rnd(4,12);do{a2=rnd(a1+3,30)}while(a2%a1===0)}
    if(a2>c.max) continue;
    S.used.add('d'+c.id);
    const b1=u*a1, b2=u*a2;
    const wrong=distract(b2,[b1+(a2-a1),a1*b1/a2,b2+u,b1*a2,b2-u,b2+b1]);
    const p=[`${c.rel}. As grandezas são <b>diretamente proporcionais</b>.`,
      `Monte a proporção: ${f(a1,a2)} = ${f(N(b1),'x')}`];
    if(a1===1) p.push(`Multiplique cruzado: 1 · x = ${a2} · ${N(b1)} → <b>x = ${N(b2)}</b>`);
    else p.push(`Multiplique cruzado: ${a1} · x = ${a2} · ${N(b1)} → ${a1} · x = ${N(a2*b1)}`,`x = ${f(N(a2*b1),a1)} → <b>x = ${N(b2)}</b>`);
    if(a1>1) p.push(`Outro jeito: se ${a1} → ${N(b1)}, então 1 → ${N(u)}. Logo, ${a2} → ${a2} · ${N(u)} = ${N(b2)}.`);
    p.push(`Resposta: <b>${c.fb(b2)}</b>.`);
    return {t:c.q(a1,b1,a2),o:[c.fb(b2),...wrong.map(c.fb)],c:0,tipo:'Regra de três',
      dica:a1===1?`Se 1 vale ${N(b1)}, quanto valem ${a2}? Multiplique ${N(b1)} por ${a2}.`:`Descubra primeiro quanto vale 1: ${N(b1)} ÷ ${a1}.`,
      tab:{a:c.A,b:c.B,r:[[N(a1),N(b1)],[N(a2),'x']]},p};
  }
  return null;
}

/* ---- regra de três inversa ---- */
function genInverse(tier){
  for(let t=0;t<600;t++){
    const c=pickCtx(INV,'i'), a1=pick1(c.av), b1=pick1(c.bv), a2=pick1(c.av);
    if(a1===a2) continue;
    const P=a1*b1; if(P%a2) continue;
    const b2=P/a2; if(b2<1||b2>c.bmax||b2===b1) continue;
    const dbl=(a2===2*a1||a1===2*a2), mult=(a2%a1===0||a1%a2===0);
    const strict=t<450;
    if(strict){
      if(tier<=4&&!dbl) continue;
      if(tier===5&&!(a2>a1&&!dbl)) continue;
      if(tier>=6&&mult) continue;
    }
    S.used.add('i'+c.id);
    const up=a2>a1, rel=c.rel[up?0:1], dir=b1*a2/a1;
    const wrong=distract(b2,[dir,b1+(a2-a1),b1-(a2-a1),b1,b2+1,b2*2]);
    const p=[`${rel}. As grandezas são <b>inversamente proporcionais</b>.`,
      `Na inversa, <b>invertemos</b> uma das razões: ${f(N(a1),N(a2))} = ${f('x',N(b1))}`,
      `Multiplique cruzado: ${N(a2)} · x = ${N(a1)} · ${N(b1)} → ${N(a2)} · x = ${N(P)}`,
      `x = ${f(N(P),N(a2))} → <b>x = ${N(b2)}</b>`,
      `Resposta: <b>${c.fb(b2)}</b>.`];
    if(Number.isInteger(dir)&&dir>0) p.push(`⚠️ Erro comum: fazer como se fosse direta e responder ${c.fb(dir)}.`);
    return {t:c.q(a1,b1,a2),o:[c.fb(b2),...wrong.map(c.fb)],c:0,tipo:'Regra de três',
      dica:`Cuidado! ${rel}. A resposta tem que ser ${b2<b1?'MENOR':'MAIOR'} que ${N(b1)}. Comece fazendo ${N(a1)} × ${N(b1)}.`,
      tab:{a:c.A,b:c.B,r:[[N(a1),N(b1)],[N(a2),'x']],inv:true},p};
  }
  return null;
}

/* ---- classificar grandezas ---- */
const CLS_TXT={D:'Diretamente proporcionais',I:'Inversamente proporcionais',N:'Não são proporcionais'};
const CLS_END={D:'Uma dobra e a outra também dobra: são grandezas <b>diretamente proporcionais</b>.',
  I:'Uma dobra e a outra cai pela metade: são grandezas <b>inversamente proporcionais</b>.',
  N:'Não seguem a regra da direta nem da inversa: <b>não são proporcionais</b>.'};
function genClass(tier,styleB){
  const lvOk=tier<=3?[1,2].slice(0,tier<=2?1:2):tier===4?[2]:tier===5?[2,3]:[3,2];
  let pool=CLS.map((x,k)=>({...x,k})).filter(x=>!S.used.has('c'+x.k)&&lvOk.includes(x.lv)&&(!styleB||x.t!=='N'));
  if(tier>=6){const hard=pool.filter(x=>x.lv===3);if(hard.length)pool=hard}
  if(!pool.length) return null;
  const it=pick1(pool); S.used.add('c'+it.k);
  const dob=/^(os|as) /.test(it.a)?'dobrarem':'dobrar';
  if(styleB){
    const o=it.t==='D'?['Também dobra','Cai pela metade']:['Cai pela metade','Também dobra'];
    return {t:`Se ${it.a} ${dob}, o que acontece com ${it.b}?`,o:[...o,'Continua igual','Aumenta só 2 unidades'],c:0,tipo:'Direta ou inversa?',
      dica:'Imagine a situação de verdade. Com o dobro da primeira coisa, a segunda aumenta ou diminui?',
      p:[it.w,CLS_END[it.t]]};
  }
  const others=['D','I','N'].filter(k=>k!==it.t).map(k=>CLS_TXT[k]);
  return {t:`Que tipo de relação existe entre <b>${it.a}</b> e <b>${it.b}</b>?`,o:[CLS_TXT[it.t],...others,'Não dá para saber'],c:0,tipo:'Direta ou inversa?',
    dica:'Faça o teste do dobro: se a primeira grandeza dobrar, a segunda dobra, cai pela metade ou nenhum dos dois?',
    p:[`Teste do dobro: se ${it.a} ${dob}, o que acontece com ${it.b}?`,it.w,CLS_END[it.t]]};
}

/* ---- proporção: achar o x ---- */
function genProp(){
  const [p,q]=pick1([[1,2],[2,3],[3,4],[2,5],[3,5],[1,3],[4,5],[1,4]]);
  let m=rnd(2,6),n; do{n=rnd(2,7)}while(n===m);
  const P1=p*m,Q1=q*m,P2=p*n,Q2=q*n;
  if(Math.random()<.5){ // x embaixo
    return {t:`Na proporção ${f(P1,'x')} = ${f(P2,Q2)}, qual é o valor de x?`,o:[Q1,...distract(Q1,[P1+(Q2-P2),Q2,Q1+p])].map(String),c:0,tipo:'Proporção',
      dica:'Multiplique em X (cruzado): o de cima de uma fração com o de baixo da outra.',
      p:[`Multiplique cruzado: ${P2} · x = ${P1} · ${Q2}`,`${P2} · x = ${P1*Q2}`,`x = ${f(P1*Q2,P2)} → <b>x = ${Q1}</b>`,`Confira: ${f(P1,Q1)} e ${f(P2,Q2)} simplificadas dão ${f(p,q)}. ✔`]};
  }
  return {t:`Na proporção ${f('x',Q1)} = ${f(P2,Q2)}, qual é o valor de x?`,o:[P1,...distract(P1,[Q1-(Q2-P2),P2,P1+1])].map(String),c:0,tipo:'Proporção',
    dica:'Multiplique em X (cruzado): o de cima de uma fração com o de baixo da outra.',
    p:[`Multiplique cruzado: ${Q2} · x = ${P2} · ${Q1}`,`${Q2} · x = ${P2*Q1}`,`x = ${f(P2*Q1,Q2)} → <b>x = ${P1}</b>`,`Confira: ${f(P1,Q1)} e ${f(P2,Q2)} simplificadas dão ${f(p,q)}. ✔`]};
}

const PCT=[
 {q:(V,p)=>`Uma bicicleta custa ${reais(V)}. Quanto é ${p}% desse valor?`,fb:reais},

 {q:(V,p)=>`Em uma escola com ${N(V)} alunos, ${p}% vão de ônibus. Quantos alunos vão de ônibus?`,fb:v=>N(v)+' alunos'},
 {q:(V,p)=>`Um tênis custa ${reais(V)} e vai ter um aumento de ${p}%. De quanto será o aumento?`,fb:reais},
 {q:(V,p)=>`Em uma pesquisa com ${N(V)} pessoas, ${p}% disseram que preferem futebol. Quantas pessoas preferem futebol?`,fb:v=>N(v)+' pessoas'}
];
function genPct(tier){
  const p=pick1(tier<=4?[10,50,25]:tier===5?[20,15,30,5]:[15,35,75,12,40,60]);
  const Vs=[40,60,80,100,120,150,200,240,250,300,360,400,500,600,800,1000,1200].filter(V=>V*p%100===0);
  const V=pick1(Vs), ans=V*p/100, c=pick1(PCT);
  const p2=['O valor inteiro corresponde a 100%. Menos porcentagem → menos valor: <b>diretamente proporcionais</b>.',
    `${f(N(V),'x')} = ${f(100,p)}`,`100 · x = ${N(V)} · ${p} → 100 · x = ${N(V*p)}`,`x = ${f(N(V*p),100)} → <b>x = ${N(ans)}</b>`];
  if(V%10===0) p2.push(`Atalho: 10% de ${N(V)} é ${N(V/10)} (é só dividir por 10).`);
  p2.push(`Resposta: <b>${c.fb(ans)}</b>.`);
  return {t:c.q(V,p),o:[ans,...distract(ans,[p,V*p/10,V-ans,ans*2,ans+p])].map(c.fb),c:0,tipo:'Porcentagem',
    dica:`100% é o valor inteiro (${N(V)}). Comece descobrindo 10%: ${N(V)} ÷ 10.`,
    tab:{a:'Valor',b:'Porcentagem (%)',r:[[N(V),'100'],['x',String(p)]]},p:p2};
}

const M={gain:null,timer:null,step:0,next:0,base:.055};
const CHORDS=[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]]; // Dó, Lá menor, Fá, Sol
const midi=n=>440*Math.pow(2,(n-69)/12);
function mNote(freq,t,dur,type,vol){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(M.gain);o.start(t);o.stop(t+dur+.05);
}
function startMusic(){
  if(!actx||!musicOn||M.timer) return;
  if(!M.gain){M.gain=actx.createGain();M.gain.connect(actx.destination)}
  M.gain.gain.setValueAtTime(M.base,actx.currentTime);
  M.next=actx.currentTime+.1;
  const spb=60/124/2; 
  M.timer=setInterval(()=>{
    while(M.next<actx.currentTime+.25){
      const s=M.step%32, ch=CHORDS[Math.floor(s/8)], k=s%8, t=M.next;
      if(k%2===0) mNote(midi(ch[0]-12+(k===4?7:0)),t,spb*1.6,'triangle',.9);         
      mNote(midi(ch[1+(k%3)]+12),t,spb*.8,'square',.22);                               
      if(k===2||k===6) mNote(2000+Math.random()*400,t,.04,'square',.12);               
      M.step++;M.next+=spb;
    }
  },60);
}
function stopMusic(){clearInterval(M.timer);M.timer=null}
function duck(on){if(M.gain&&actx)M.gain.gain.setTargetAtTime(on?M.base*.3:M.base,actx.currentTime,.15)}

  const tier=TIER[S.i]; let q=null;
  for(let t=0;t<50&&!q;t++) q=GEN[weighted(MIX[tier])](Math.min(tier,6));
  if(!q) q=genDirect(Math.min(tier,6));
  const ord=shuffle([0,1,2,3]);
  return {...q,view:ord.map(k=>q.o[k]),ci:ord.indexOf(q.c)};
}
function nextQ(skipped){S.q=draw();S.sel=null;S.locked=false;S.hint=false;S.gone=[];S.asking=false;renderGame();startTimer();
  const queue=skipped===true;
  if(S.i===15) say('Atenção, muita atenção! Chegou a pergunta do milhão! Valendo um milhão de reais!',{rate:1,pitch:1.2,queue});
  else if(queue) say(`Nova pergunta, valendo ${spoken(PR[S.i])}!`,{queue});
  else if(S.i===0) say(`${S.playerName !== 'Anônimo' ? S.playerName + ', e' : 'E'}stá começando o Show da Proporção! Primeira pergunta, valendo mil reais!`);
  else say(`${HYPE[S.i%HYPE.length]} Pergunta ${S.i+1}, valendo ${spoken(PR[S.i])}!`);
  readQ(true);
}
function readQ(queued){const q=S.q;say(plain(q.t)+' '+q.view.map((o,k)=>`Letra ${LET[k]}: ${plain(o)}.`).filter((_,k)=>!S.gone.includes(k)).join(' '),{rate:1,pitch:1.05,queue:queued===true,show:queued!==true})}

/* ---------- jogo ---------- */
function renderGame(){
  const q=S.q, fin=S.i===15, errar=fin?0:Math.floor(S.won/2);
  const ladder=PR.map((p,k)=>`<div class="rung ${k<S.i?'done':''} ${k===S.i?'now':''} ${k===15?'top':''} ${k===5||k===10||k===15?'sep':''}"><span>${k+1}</span><span>${money(p)}</span></div>`).join('');

        <span class="chip">Parar: ${S.won?money(S.won):'R$ 0'}</span>
        <span class="chip">Errar: ${errar?money(errar):'R$ 0'}</span>

      <div class="qhead">

        <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end">

        </span>

      ${S.hint?`<div class="hint"><b>🎓 Dica dos universitários:</b> ${q.dica}</div>`:''}
      <div class="opts" role="group" aria-label="Alternativas">
        ${q.view.map((o,k)=>`<button class="opt ${S.sel===k?'sel':''} ${S.gone.includes(k)?'gone':''}" data-k="${k}" ${S.gone.includes(k)?'disabled':''}><span class="l">${LET[k]}</span><span>${o}</span></button>`).join('')}
      </div>

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));

  const st=document.getElementById('stop'); if(st) st.onclick=()=>{S.asking=true;say('Vai parar? Está certo disso?');renderKeepClock()};
  const sy=document.getElementById('sy'); if(sy) sy.onclick=()=>endScreen('stop',S.won);
  const sn=document.getElementById('sn'); if(sn) sn.onclick=()=>{S.asking=false;renderKeepClock()};
  app.querySelectorAll('.help').forEach(b=>b.onclick=()=>useHelp(b.dataset.h));
  
  const bLdr = document.getElementById('bLdr');
  if(bLdr) {
      bLdr.onclick = () => {
          const ldr = document.getElementById('m-ldr');
          const isVis = ldr.style.display === 'flex';
          ldr.style.display = isVis ? 'none' : 'flex';
          bLdr.textContent = isVis ? 'Ver Prêmios (Escada)' : 'Ocultar Prêmios';
      };
  }

  if(S.timer) updateClock();
}
function renderKeepClock(){renderGame()}
const ASK=['Está certo disso?','Está certo disso? Posso confirmar?','Tem certeza? Está certo disso?'];
function pick(k){
  if(S.locked||S.gone.includes(k)) return;
  S.sel=k; SFX.click();
  say(`Letra ${LET[k]}? ${ASK[Math.floor(Math.random()*ASK.length)]}`,{rate:1.02,pitch:1.2});
  renderGame();
}
function helpBtn(h,ic,name,sub){
  const off=S.locked||S.i===15||S.helps[h]<=0;
  return `<button class="help" data-h="${h}" ${off?'disabled':''}><span class="ic">${ic}</span>${name}<small>${sub}</small></button>`;
}
function useHelp(h){
  if(S.locked||S.helps[h]<=0) return; SFX.click(); S.helps[h]--;
  if(h==='pular'){
    const r=S.helps.pular;
    say(`Vai pular? Pode pular! ${r===0?'Essa foi a sua última chance de pular!':r===1?'Ainda resta uma chance de pular.':'Ainda restam '+r+' chances de pular.'}`,{pitch:1.2});
    stopTimer();nextQ(true);return}
  if(h==='cartas'){
    S.gone=shuffle([0,1,2,3].filter(k=>k!==S.q.ci)).slice(0,2).sort();if(S.gone.includes(S.sel))S.sel=null;
    const left=[0,1,2,3].filter(k=>!S.gone.includes(k));
    say(`Vamos às cartas! Ih, saíram as letras ${LET[S.gone[0]]} e ${LET[S.gone[1]]}! Agora sobraram só a letra ${LET[left[0]]} e a letra ${LET[left[1]]}. Qual vai ser?`,{pitch:1.2});
  }
  if(h==='univ'){S.hint=true;say(`Vamos ouvir os universitários! Atenção para a dica: ${plain(S.q.dica)}`,{rate:1,pitch:1.1})}
  if(h==='turma'){
      if(S.classMode){
          openVote();
          say('Vamos pedir a ajuda da turma! Levante a mão quem acha que é a letra A... agora a letra B... letra C... e letra D!',{rate:.95,pitch:1.2});
      } else {
          autoVote();
          say('Vamos pedir a ajuda da plateia! O auditório já votou, vamos conferir o resultado!',{rate:1,pitch:1.1});
      }
  }
  renderGame();
}

/* votação automatica (solo player) */
function autoVote(){
    const v = [0,0,0,0];
    let rem = 100;
    // chance grande da certa ganhar
    const rightShare = rnd(40, 75);
    v[S.q.ci] = rightShare;
    rem -= rightShare;
    
    const others = [0,1,2,3].filter(k=>k!==S.q.ci && !S.gone.includes(k));
    others.forEach((k, idx) => {
        if (idx === others.length - 1) {
            v[k] = rem;
        } else {
            const share = rnd(0, rem);
            v[k] = share;
            rem -= share;
        }
    });

    modal.innerHTML=`<div class="veil"><div class="sheet" role="dialog" aria-label="Ajuda da Plateia">
      <h2 class="gc">👥 Ajuda da Plateia</h2>
      <p class="lead">A plateia votou e este é o resultado:</p>
      <div class="vote">${v.map((n,k)=>`<div class="vrow" ${S.gone.includes(k)?'style="opacity:0.3"':''}><span class="l">${LET[k]}</span>
        <div class="bar"><i style="width:${n}%"></i><span>${n}%</span></div></div>`).join('')}</div>
      <div class="row"><button class="confirm" id="vclose">Voltar à pergunta</button></div>
    </div></div>`;
    
    document.getElementById('vclose').onclick=()=>{
        modal.innerHTML='';
        const m=Math.max(...v),k=v.indexOf(m);
        say(`A plateia escolheu a letra ${LET[k]} com ${m}% dos votos. Será que eles estão certos?`,{pitch:1.2});
    };
}

/* votação manual da turma */
function openVote(){
  const v=[0,0,0,0];
  const draw=()=>{
    const tot=v.reduce((a,b)=>a+b,0)||1;
    modal.innerHTML=`<div class="veil"><div class="sheet" role="dialog" aria-label="Votação da turma">
      <h2 class="gc">🙋 Votação da turma</h2>
      <p class="lead">Leia cada letra em voz alta. Quem escolhe aquela letra levanta a mão. Registre os votos com <b>+</b>.</p>
      <div class="vote">${v.map((n,k)=>`<div class="vrow"><span class="l">${LET[k]}</span>
        <div class="bar"><i style="width:${n/tot*100}%"></i><span>${n} voto${n===1?'':'s'}</span></div>
        <div class="pm"><button data-m="${k}" aria-label="Tirar voto ${LET[k]}">−</button><button data-p="${k}" aria-label="Somar voto ${LET[k]}">+</button></div></div>`).join('')}</div>
      <div class="row"><button class="confirm" id="vclose">Voltar à pergunta</button></div>
    </div></div>`;
    modal.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{v[+b.dataset.p]++;SFX.click();draw()});
    modal.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=+b.dataset.m;if(v[k]>0)v[k]--;draw()});
    document.getElementById('vclose').onclick=()=>{modal.innerHTML='';
      const tot=v.reduce((a,b)=>a+b,0);
      if(tot){const m=Math.max(...v),k=v.indexOf(m);say(`A turma votou! A letra mais votada foi a letra ${LET[k]}, com ${m} ${m===1?'voto':'votos'}. E agora, vai confiar na turma?`,{pitch:1.2})}
    };
  };
  draw();
}

/* cronômetro com barra */
function startTimer(){stopTimer();if(!S.timer)return;S.left=S.timer;S.said30=false;updateClock();
  timerId=setInterval(()=>{if(modal.innerHTML)return;S.left--;if(S.left<=10)SFX.tick();updateClock();if(S.left<=0){stopTimer();S.sel=null;answer(true)}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function updateClock(){
  const c=document.getElementById('clock');
  const tb=document.getElementById('tbar');
  if(c){
      c.textContent=Math.floor(S.left/60)+':'+String(S.left%60).padStart(2,'0');
      c.classList.toggle('low',S.left<=10);
  }
  if(tb){
      const pct = Math.max(0, (S.left / S.timer) * 100);
      tb.style.width = pct + '%';
      tb.classList.toggle('low', S.left<=10);
  }
  if(S.left===30&&S.timer>30&&!S.locked&&!S.said30&&(S.said30=true)) say('Atenção! Faltam 30 segundos!',{queue:true});
}

/* responder */
function answer(timeout){
  if(S.locked) return; if(S.sel===null && timeout!==true) return;
  S.locked=true; stopTimer();
  const btns=[...app.querySelectorAll('.opt')]; btns.forEach(b=>b.disabled=true);
  app.querySelectorAll('.help,#ans,#stop').forEach(b=>b&&(b.disabled=true));
  if(S.sel!==null){btns[S.sel].classList.add('wait');say('Valendo! Vamos ver...',{rate:.95,pitch:1.1})}
  SFX.suspense();
  setTimeout(()=>{
    const ok=S.sel===S.q.ci;
    btns.forEach(b=>b.classList.remove('wait'));
    btns[S.q.ci].classList.add('right');
    if(!ok && S.sel!==null){btns[S.sel].classList.add('wrong');document.getElementById('qbox').classList.add('shake')}
    ok?SFX.right():SFX.wrong();
    setTimeout(()=>feedback(ok,timeout===true),900);
  },1900);
}

function explHTML(q){
  let h='';
  if(q.tab){
    const t=q.tab, cell=v=>`<td class="${v==='x'?'x':''}">${v}</td>`;
    h+=`<h4>Monte a tabela</h4><div class="rtwrap"><table class="rt"><thead><tr><th>${t.a}</th><th>${t.b}</th></tr></thead><tbody>
      ${t.r.map(r=>`<tr>${cell(r[0])}${cell(r[1])}</tr>`).join('')}</tbody>
      <tfoot><tr><td class="down">↓</td><td class="${t.inv?'up':'down'}">${t.inv?'↑':'↓'}</td></tr></tfoot></table></div>
      <div class="kind ${t.inv?'inv':'dir'}">${t.inv?'Setas em sentidos opostos: grandezas inversamente proporcionais':'Setas no mesmo sentido: grandezas diretamente proporcionais'}</div>`;
  }
  h+=`<h4>Resolução passo a passo</h4><ol class="steps">${q.p.map(s=>`<li>${s}</li>`).join('')}</ol>`;
  return `<div class="expl">${h}</div>`;
}

function feedback(ok,timeout){
  const q=S.q, fin=S.i===15, right=q.view[q.ci];
  if(ok){
    S.acertos++; S.won=PR[S.i];
    if(fin){confetti();SFX.win();say(`É um milhão de reais! Parabéns ${S.playerName}, você é o campeão da proporção!`,{rate:1,pitch:1.25})}
    else say(`Certa resposta! Você acaba de ganhar ${spoken(S.won)}!`,{rate:1.1,pitch:1.2});
    const errarProx = fin ? 0 : Math.floor(S.won/2);
    const nextPrize = fin ? 0 : PR[S.i+1];
    
    modal.innerHTML=`<div class="veil"><div class="sheet" role="dialog">
      <h2 class="okc">${fin?'VOCÊ GANHOU 1 MILHÃO!':'Certa resposta!'}</h2>
      <p class="lead">A resposta é <b>${right}</b>. Você garantiu <b>${money(S.won)}</b>.</p>
      
      <div style="margin-bottom: 16px;">
        <button class="stop" id="btnShowExpl" style="background:var(--panel2); border-color:var(--sky); color:var(--sky); width:100%; font-size:16px; padding:12px;">Ver Resolução Passo a Passo</button>
      </div>
      <div id="explArea" hidden>${explHTML(q)}</div>
      
      ${!fin ? `
      <div style="margin-top:20px; background:var(--stage); padding:16px; border-radius:16px; border:2px dashed var(--gold);">
         <h4 style="margin:0 0 10px; color:var(--gold);">O que você vai fazer?</h4>
         <p style="margin:0 0 16px; font-size:15px; color:var(--muted);">
           Se você continuar para a próxima valendo <b>${money(nextPrize)}</b> e errar, você perde metade e cai para <b>${money(errarProx)}</b>.<br>
           ${S.i===14 ? '<b style="color:var(--bad)">Atenção: A próxima é a pergunta do MILHÃO. Se errar, perde TUDO (R$ 0).</b>' : ''}
         </p>
         <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="confirm" id="nx" style="flex:1;">Arriscar Próxima (${money(nextPrize)})</button>
            <button class="stop" id="stopNow" style="background:var(--bad); border-color:var(--bad); color:#fff; font-weight:bold; flex:1;">Parar agora e levar ${money(S.won)}</button>
         </div>
      </div>
      ` : `
      <div class="row"><button class="confirm" id="nx">Ver resultado final</button></div>
      `}
    </div></div>`;
    
    if(!fin) confetti(25);
    
    const bExpl = document.getElementById('btnShowExpl');
    if(bExpl) {
        bExpl.onclick = () => {
            const expl = document.getElementById('explArea');
            expl.hidden = !expl.hidden;
            bExpl.textContent = expl.hidden ? 'Ver Resolução Passo a Passo' : 'Ocultar Resolução';
        };
    }
    
    document.getElementById('nx').onclick=()=>{modal.innerHTML='';if(fin)endScreen('win',S.won);else{S.i++;nextQ()}};
    const bStop = document.getElementById('stopNow');
    if(bStop) {
        bStop.onclick=()=>{modal.innerHTML=''; endScreen('stop',S.won)};
    }

  }else{
    const keep=fin?0:Math.floor(S.won/2);
    const perdText = fin ? 'Você errou a pergunta do milhão e PERDEU TUDO!' : `Você errou e vai levar apenas a metade: ${money(keep)}.`;
    say(`${timeout?'O tempo acabou!':'Que pena! Você errou!'} ${perdText} A resposta certa era a letra ${LET[q.ci]}.`,{rate:1.02,pitch:1.05});
    modal.innerHTML=`<div class="veil"><div class="sheet" role="dialog">
      <h2 class="badc">${timeout?'O tempo acabou!':'Que pena, você errou!'}</h2>
      <p class="lead">A resposta certa era <b>${right}</b>. ${perdText}</p>
      <div style="margin-bottom: 16px;">
        <button class="stop" id="btnShowExpl" style="background:var(--panel2); border-color:var(--sky); color:var(--sky); width:100%; font-size:16px; padding:12px;">Ver Resolução Passo a Passo</button>
      </div>
      <div id="explArea" hidden>${explHTML(q)}</div>
      <div class="row"><button class="confirm" id="nx">Ver resultado final</button></div>
    </div></div>`;
    
    const bExpl = document.getElementById('btnShowExpl');
    if(bExpl) {
        bExpl.onclick = () => {
            const expl = document.getElementById('explArea');
            expl.hidden = !expl.hidden;
            bExpl.textContent = expl.hidden ? 'Ver Resolução Passo a Passo' : 'Ocultar Resolução';
        };
    }
    document.getElementById('nx').onclick=()=>{modal.innerHTML='';endScreen('lose',keep)};
  }
}

/* ---------- fim ---------- */
function endScreen(how,prize){
  stopTimer(); modal.innerHTML='';
  if(how==='stop') say(`Parou! ${S.playerName} vai levar para casa ${prize?spoken(prize):'zero reais'}! Muito bem!`);
  else if(how==='lose') say(`${S.playerName} vai levar para casa ${prize?spoken(prize):'zero reais'}. Obrigado por participar do Show da Proporção!`);
  const msg={win:`Campeão da proporção! Você acertou todas, ${S.playerName}.`,stop:'Você parou na hora certa e garantiu o prêmio.',lose:'Errar faz parte. Agora você já sabe o caminho da conta!'}[how];
  
  // Portal da turma: envia a nota ao professor
  if (window.GAMIFICA && GAMIFICA.enviar(S.acertos, PR.length, prize || 0)) GAMIFICA.aviso('📤 Nota enviada ao professor: ' + S.acertos + ' de ' + PR.length + ' perguntas');
  // Salvar no Ranking
  const currentRankList = saveRanking(S.playerName, prize || 0);

  let moneyIcon = '💸';
  if (how === 'win') moneyIcon = '🏆💰🏆';
  else if (prize > 0) moneyIcon = '💰';

  if (how === 'win') {
      confetti(250);
      victoryFanfare();

  app.innerHTML=`

    <p class="sub">${msg}</p>
    
    <div class="winner-panel ${extraClass}">
       <div class="m-icon">${moneyIcon}</div>

            <span class="rank-pos">${idx + 1}º</span>
            <span class="rank-name">${r.name}</span>
            <span class="rank-prize">${money(r.won)}</span>
          </li>
        `).join('')}

      </ol>
      <button class="linkbtn" id="gb">Mostrar gabarito</button>
      <div class="gab" id="gab" hidden>
        1) Direta: ${f(4,10)} = ${f(6,'x')} → 4 · x = 60 → <b>x = R$ 15,00</b>.<br>
        2) Inversa (menos famílias, mais dias): ${f(5,3)} = ${f('x',12)} → 3 · x = 60 → <b>x = 20 dias</b>.<br>

  </section>`;

          clearRanking();
          document.getElementById('rankList').innerHTML = '<li class="rank-item" style="justify-content:center;color:var(--muted)">Ranking vazio.</li>';
      }
  };
  
  document.getElementById('printBtn').onclick = () => {
      const printDiv = document.createElement('div');
      printDiv.id = 'print-area';
      const date = new Date().toLocaleDateString('pt-BR');
      const questionsPlayed = S.i + (how==='win'?1:0);
      printDiv.innerHTML = `
          <h1>Relatório - Show da Proporção</h1>
          <p><strong>Jogador:</strong> ${S.playerName}</p>
          <p><strong>Data:</strong> ${date}</p>
          <p><strong>Desempenho:</strong> ${S.acertos} acertos em ${questionsPlayed} perguntas jogadas.</p>
          <p><strong>Prêmio Final:</strong> ${prize?money(prize):'R$ 0'}</p>
          <hr style="margin:20px 0;">
          <h3>Resumo de Aprendizagem</h3>
          <p>O jogador demonstrou conhecimentos nos temas abordados até a Pergunta ${questionsPlayed}.</p>
          <ul>
              <li>Reconhecimento de grandezas diretamente e inversamente proporcionais.</li>
              <li>Aplicação de regra de três simples.</li>
              <li>Cálculo de porcentagens e proporções na prática.</li>
          </ul>
          <br><br><br>
          <p>____________________________________________________<br><br>Assinatura do Aluno / Professor</p>
      `;
      document.body.appendChild(printDiv);
      window.print();
      document.body.removeChild(printDiv);
  };
}

function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#ffc93c','#2ed47a','#58c6ff','#ff5468','#ffffff'];
  for(let k=0;k<n;k++){const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[k%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
}

/* teclado: A–D ou 1–4 escolhem, Enter responde */
document.addEventListener('keydown',e=>{
  if(!S||S.locked||modal.innerHTML||!document.querySelector('.opts'))return;
  const k='ABCD1234'.indexOf(e.key.toUpperCase());
  if(k>=0) pick(k%4);
  if(e.key==='Enter'&&S.sel!==null){e.preventDefault();answer()}
});

/* música a partir do primeiro toque/clique em qualquer lugar (o navegador bloqueia som antes disso) */
function splash(){
  app.innerHTML=`
  <section class="start" style="padding-top:8vh">
    <div class="marquee"><small>Proporcionalidade e regra de três</small>Show da Proporção</div>
    <div><button class="big" id="open" style="font-size:28px;padding:20px 40px">▶ Abrir o show</button></div>
    <p class="sub">Clique para abrir o programa com música e apresentador.</p>
  </section>`;
  document.getElementById('open').onclick=()=>{
    ensureAudio(); startMusic(); SFX.win();
    say('Está no ar o Show da Proporção! Escolha o tempo e vamos começar!',{pitch:1.2});
    startScreen();
  };
}
splash();

// Fim do IIFE
})();
