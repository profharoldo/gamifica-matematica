<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atividade · Gamefica Ação Matemática</title>
<link rel="icon" href="../favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/svg+xml" href="../icone.svg?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="../icone-192.png?v=3">
<link rel="apple-touch-icon" href="../icone-180.png?v=3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{--ink:#1b2440;--muted:#5d6785;--line:#e1e6f0;--primary:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background-color:#1d2b53;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;display:flex;flex-direction:column}
  .centro{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
  .cartao{background:#fff;border-radius:22px;padding:0 0 24px;overflow:hidden;width:100%;max-width:440px;box-shadow:0 16px 50px rgba(10,10,60,.35);animation:sobe .4s ease}
  @keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .cartao>*:not(.post){margin-left:24px;margin-right:24px}
  .cartao>.post+*{margin-top:18px}
  .cartao>:first-child:not(.post){margin-top:24px}
  .post{height:130px;display:grid;place-items:center;font-size:64px;position:relative;background:var(--n,#ffe27a)}
  .post .tema{position:absolute;left:14px;top:12px;font-size:12px;font-weight:800;background:rgba(255,255,255,.65);padding:2px 10px;border-radius:99px;color:#1d2b53}
  h1{margin:0 0 4px;font-size:1.45rem;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600}
  p{margin:6px 0}
  .muted{color:var(--muted);font-size:.95rem}
  label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 5px}
  input{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;font-size:1.05rem}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
  button{font:inherit;cursor:pointer;border:2px solid #e0ad00;border-radius:14px;padding:14px 18px;font-weight:800;font-size:1.1rem;background:#ffd23f;color:#1d2b53;box-shadow:0 3px 0 #e0ad00;width:100%;margin-top:16px}
  button.sec{background:#eef0fb;color:var(--primary)}
  button:disabled{opacity:.6}
  .msg{padding:10px 12px;border-radius:12px;margin-top:12px;font-size:.95rem}
  .erro{background:#fee2e2;color:#991b1b}
  .ok{background:#dcfce7;color:#166534}
  .emoji{font-size:2.6rem;line-height:1}
  .nota{font-size:3.4rem;font-weight:900;line-height:1.1;margin:6px 0}
  .barra{display:none;align-items:center;justify-content:space-between;gap:10px;background:#1e1b4b;color:#fff;padding:8px 14px;font-size:.9rem}
  .barra b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .barra #barra-status{white-space:nowrap;font-weight:700}
  .barra #barra-status.st-ok{color:#86efac}
  .barra #barra-status.st-erro{color:#fca5a5}
  .barra button{width:auto;margin:0;padding:5px 10px;font-size:.85rem;border-radius:9px;box-shadow:none}
  iframe{display:none;flex:1;width:100%;border:0;background:#fff}
  body.jogando .barra{display:flex}
  body.jogando iframe{display:block}
  body.jogando .centro{display:none}
  .parabens{position:fixed;inset:0;z-index:50;background:rgba(20,18,60,.82);display:none;align-items:center;justify-content:center;padding:16px}
  .parabens.on{display:flex}
  .parabens .cx{background:#fff;border-radius:24px;max-width:440px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:sobe .45s ease}
  .parabens .grande{font-size:4rem;line-height:1}
  .parabens h2{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:1.6rem;margin:8px 0 4px}
  .parabens .nota{color:var(--primary)}
</style>
</head>
<body>
<div class="barra"><b id="barra-titulo"></b><span id="barra-status" role="status" aria-live="polite"></span><button id="barra-reenviar" type="button" hidden>🔁 Reenviar</button></div>
<div class="centro"><div class="cartao" id="cartao"><p>Carregando atividade…</p></div></div>
<div class="parabens" id="parabens" role="dialog" aria-modal="true" aria-live="polite"><div class="cx" id="parabens-cx"></div></div>
<iframe id="quadro" title="Atividade" allow="autoplay; fullscreen"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="jogos.js"></script>
<script>
(function(){
'use strict';

var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var cartao = document.getElementById('cartao');
var quadro = document.getElementById('quadro');
var codigo = (new URLSearchParams(location.search).get('a') || '').trim().toUpperCase();
var atividade = null;
var aluno = {nome:'', turma:''};
var inicio = 0;
var enviando = false;
var pendente = null;

function el(tag, props){
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v === null || v === undefined || v === false) return;
    if(k === 'class') e.className = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else e.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    [].concat(arguments[i]).forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function mostrar(){ cartao.replaceChildren.apply(cartao, arguments); }
function guardar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function ler(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function chaveProg(){ return 'gm_prog_' + codigo; }
function lerProg(){ try{ return JSON.parse(localStorage.getItem(chaveProg()) || 'null'); }catch(e){ return null; } }
function gravarProg(p){ try{ localStorage.setItem(chaveProg(), JSON.stringify(p)); }catch(e){} }
var prog = null;
function fmtNota(n){ return Number(n).toFixed(1).replace('.', ','); }

async function iniciar(){
  if(!/^[A-Z0-9]{4,12}$/.test(codigo)){ return erroTela('Link inválido', 'Peça ao seu professor o link correto da atividade.'); }
  var r = await sb.rpc('obter_atividade', {p_codigo: codigo});
  if(r.error){ return erroTela('Sem conexão', 'Não consegui abrir a atividade. Verifique a internet e tente de novo.'); }
  if(!r.data || r.data.length === 0){ return erroTela('Atividade não encontrada', 'Ela pode ter sido encerrada ou o link está incompleto. Fale com seu professor.'); }
  atividade = r.data[0];
  if(!window.JOGOS[atividade.jogo]){ return erroTela('Jogo indisponível', 'Este jogo ainda não está no portal. Avise seu professor.'); }
  prog = lerProg();
  if(prog && prog.nome && prog.estado === 'concluido') return telaConcluida();
  if(prog && prog.nome && prog.estado === 'andamento') return telaRetomar();
  telaNome();
}

function telaRetomar(){
  var J = window.JOGOS[atividade.jogo];
  mostrar(el('div', {class:'emoji'}, '👋'),
    el('h1', {}, 'Que bom ver você de novo, ' + prog.nome.split(' ')[0] + '!'),
    el('p', {class:'muted'}, 'Você estava fazendo esta atividade: ' + atividade.titulo + '. ' + (prog.save ? 'Seu andamento foi guardado e o jogo continua de onde você parou.' : 'Seus dados foram mantidos.')),
    el('button', {type:'button', onclick: function(){ aluno = {nome: prog.nome, turma: prog.turma || ''}; comecar(true); }}, '▶️ Continuar a atividade'),
    el('button', {type:'button', class:'sec', onclick: function(){ prog = null; try{ localStorage.removeItem(chaveProg()); }catch(e){} telaNome(); }}, 'Não sou eu / começar do zero'));
}
function telaConcluida(){
  mostrar(el('div', {class:'emoji'}, '🏆'),
    el('h1', {}, 'Você já concluiu esta atividade!'),
    el('p', {class:'muted'}, prog.nome + ', sua nota foi'), el('div', {class:'nota'}, fmtNota(prog.nota)),
    el('p', {class:'muted'}, mensagemFinal(Number(prog.nota)).texto),
    el('button', {type:'button', onclick: function(){ aluno = {nome: prog.nome, turma: prog.turma || ''}; prog = null; comecar(); }}, '🔁 Jogar de novo para melhorar'));
}
function mensagemFinal(n){
  if(n >= 8) return {emoji:'🌟', titulo:'Arrasou', texto:'Você dominou este assunto. Continue assim, seu esforço está aparecendo!'};
  if(n >= 6) return {emoji:'🎉', titulo:'Muito bem', texto:'Você está no caminho certo. Mais uma tentativa e você chega ainda mais longe!'};
  return {emoji:'💪', titulo:'Parabéns por terminar', texto:'Terminar já é uma vitória. Errar faz parte de aprender: jogue de novo e veja como você melhora a cada tentativa!'};
}
function festa(nota){
  var m = mensagemFinal(nota), primeiro = aluno.nome.split(' ')[0];
  var box = document.getElementById('parabens-cx');
  box.replaceChildren(el('div', {class:'grande'}, m.emoji), el('h2', {}, m.titulo + ', ' + primeiro + '!'),
    el('p', {class:'muted'}, 'Você terminou a atividade. Sua nota:'), el('div', {class:'nota'}, fmtNota(nota)),
    el('p', {}, m.texto),
    el('button', {type:'button', onclick: function(){ document.getElementById('parabens').classList.remove('on'); }}, '👍 Fechar'),
    el('button', {type:'button', class:'sec', onclick: function(){ document.getElementById('parabens').classList.remove('on'); prog = null; comecar(); }}, '🔁 Jogar de novo'));
  document.getElementById('parabens').classList.add('on');
}

function erroTela(titulo, texto){
  mostrar(el('div', {class:'emoji'}, '😕'), el('h1', {}, titulo), el('p', {class:'muted'}, texto));
}

function telaNome(){
  var nome = el('input', {type:'text', id:'nome', maxlength:'80', autocomplete:'name', placeholder:'Nome e sobrenome', value: ler('gm_nome')});
  var turma = el('input', {type:'text', id:'turma', maxlength:'40', placeholder:'Ex.: 3ª A', value: atividade.turma || ler('gm_turma')});
  var aviso = el('div');
  var form = el('form', {onsubmit: function(ev){
    ev.preventDefault(); aviso.replaceChildren();
    var n = nome.value.trim().replace(/\s+/g, ' ');
    if(n.length < 2){ aviso.append(el('div', {class:'msg erro'}, 'Digite seu nome completo para o professor reconhecer você.')); return; }
    aluno = {nome: n, turma: turma.value.trim()};
    guardar('gm_nome', aluno.nome); guardar('gm_turma', aluno.turma);
    comecar();
  }},
    el('label', {for:'nome'}, 'Seu nome'), nome,
    el('label', {for:'turma'}, 'Sua turma'), turma,
    el('button', {type:'submit'}, '🚀 Começar'), aviso);
  var J = window.JOGOS[atividade.jogo];
  var cores = {amarelo:'#ffe27a', coral:'#ffb4a6', verde:'#a6e4c6', azul:'#b9d4ff', lilas:'#d8c9ff', laranja:'#ffc88a'};
  mostrar(el('div', {class:'post', style:'--n:' + (cores[J.cor] || cores.amarelo)}, J.tema ? el('span', {class:'tema'}, J.tema) : null, J.emoji || '🎮'),
    el('h1', {}, atividade.titulo),
    el('p', {class:'muted'}, 'Digite seus dados. Ao terminar, sua nota é enviada automaticamente ao professor.'),
    form);
}

function comecar(retomando){
  document.getElementById('barra-titulo').textContent = atividade.titulo;
  setStatus('', '');
  document.body.className = 'jogando';
  enviando = false; pendente = null;
  var antigo = lerProg();
  inicio = (retomando && antigo && antigo.inicio) ? antigo.inicio : Date.now();
  gravarProg({nome: aluno.nome, turma: aluno.turma, estado: 'andamento', inicio: inicio, save: (retomando && antigo) ? antigo.save : null});
  carregarJogo();
}
var urlJogo = null;
async function carregarJogo(){
  setStatus('⏳ Abrindo o jogo…', '');
  try{
    var r = await fetch(window.SUPABASE_URL + '/functions/v1/jogo', {method:'POST',
      headers:{'Content-Type':'application/json', 'apikey': window.SUPABASE_KEY}, body: JSON.stringify({codigo: codigo})});
    if(!r.ok){ var e = await r.json().catch(function(){ return {}; }); throw new Error(e.erro || 'Erro ' + r.status); }
    var html = await r.text();
    if(urlJogo) URL.revokeObjectURL(urlJogo);
    urlJogo = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    quadro.src = urlJogo;
    setStatus('', '');
  }catch(e){
    document.body.className = '';
    erroTela('Não foi possível abrir o jogo', (e.message || 'Verifique a internet') + '. Tente de novo em instantes.');
  }
}
// O nome do aluno é entregue ao jogo por mensagem (não vai na URL).
quadro.addEventListener('load', function(){
  try{ var pg = lerProg();
    quadro.contentWindow.postMessage({tipo:'gamifica-aluno', nome: aluno.nome, turma: aluno.turma, estado: (pg && pg.save) || null}, '*'); }catch(e){}
});
var statusEl = document.getElementById('barra-status');
var reenviarBtn = document.getElementById('barra-reenviar');
function setStatus(texto, classe){ statusEl.textContent = texto; statusEl.className = classe || ''; }
reenviarBtn.addEventListener('click', function(){ if(pendente) enviar(); });

window.addEventListener('message', function(ev){
  if(ev.source !== quadro.contentWindow) return;
  var d = ev.data;
  if(d && d.tipo === 'gamifica-estado'){
    try{
      var txt = JSON.stringify(d.estado);
      if(txt && txt.length < 200000){ var pg = lerProg() || {nome: aluno.nome, turma: aluno.turma, estado:'andamento', inicio: inicio}; if(pg.estado === 'andamento'){ pg.save = d.estado; gravarProg(pg); } }
    }catch(e){}
    return;
  }
  if(!d || d.tipo !== 'gamifica-resultado' || enviando) return;
  var acertos = Number(d.acertos), total = Number(d.total), pontos = Number(d.pontos || 0);
  if(!Number.isInteger(acertos) || !Number.isInteger(total) || total < 1 || total > 200 || acertos < 0 || acertos > total) return;
  pendente = {
    p_codigo: codigo, p_nome: aluno.nome, p_turma: aluno.turma || '',
    p_acertos: acertos, p_total: total,
    p_pontos: Number.isFinite(pontos) ? Math.max(0, Math.round(pontos)) : 0,
    p_tempo: Math.max(0, Math.round((Date.now() - inicio) / 1000))
  };
  enviar();
});

async function enviar(){
  enviando = true; reenviarBtn.hidden = true;
  setStatus('📤 Enviando nota…', '');
  var r = await sb.rpc('enviar_resultado', pendente);
  enviando = false;
  if(r.error){
    var enc = /encerrada/i.test(r.error.message);
    setStatus(enc ? '⚠ Atividade encerrada pelo professor' : '⚠ Nota não enviada', 'st-erro');
    reenviarBtn.hidden = enc;
    return;
  }
  setStatus('✔ Nota enviada: ' + fmtNota(Number(r.data)) + ' (' + pendente.p_acertos + '/' + pendente.p_total + ')', 'st-ok');
  gravarProg({nome: aluno.nome, turma: aluno.turma, estado: 'concluido', nota: Number(r.data), acertos: pendente.p_acertos, total: pendente.p_total});
  festa(Number(r.data));
}

window.addEventListener('beforeunload', function(e){
  var pg = lerProg();
  if(document.body.classList.contains('jogando') && pg && pg.estado === 'andamento'){ e.preventDefault(); e.returnValue = ''; return ''; }
});
iniciar();
})();
</script>
</body>
</html>
