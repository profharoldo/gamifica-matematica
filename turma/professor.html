<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Professor · Gamefica Ação Matemática</title>
<style>
  :root{
    --bg:#f3f6fb; --card:#ffffff; --ink:#1b2440; --muted:#5d6785; --line:#e1e6f0;
    --primary:#4f46e5; --primary-ink:#ffffff; --accent:#f59e0b; --ok:#16a34a; --bad:#dc2626;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  header.topo{background:linear-gradient(135deg,#312e81,#4f46e5 60%,#7c3aed);color:#fff;padding:18px 16px}
  header.topo .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header.topo h1{font-size:1.25rem;margin:0}
  header.topo small{opacity:.85}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(30,40,90,.05)}
  h2{margin:0 0 10px;font-size:1.1rem}
  label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
  input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--primary);color:var(--primary-ink)}
  button:hover{filter:brightness(1.07)}
  button.sec{background:#eef0fb;color:var(--primary)}
  button.perigo{background:#fee2e2;color:var(--bad)}
  button.peq{padding:8px 12px;font-size:.9rem}
  button:disabled{opacity:.55;cursor:default}
  .linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:.95rem}
  .msg.erro{background:#fee2e2;color:#991b1b}
  .msg.ok{background:#dcfce7;color:#166534}
  .msg.info{background:#e0e7ff;color:#3730a3}
  .tabs{display:flex;gap:8px;margin-bottom:6px}
  .tabs button{flex:1;background:#eef0fb;color:var(--primary)}
  .tabs button.ativo{background:var(--primary);color:#fff}
  .ativ{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#fbfcff}
  .ativ h3{margin:0 0 4px;font-size:1.02rem}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#eef0fb;color:var(--primary);font-size:.8rem;font-weight:700;margin-right:6px}
  .tag.enc{background:#fee2e2;color:var(--bad)}
  .link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:#f1f3f9;border-radius:10px;padding:8px 10px;word-break:break-all;margin:8px 0}
  .tabela-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:560px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.93rem}
  th{background:#eef0fb;color:#303a73;position:sticky;top:0}
  td.n,th.n{text-align:center}
  .nota-alta{color:var(--ok);font-weight:800}
  .nota-baixa{color:var(--bad);font-weight:800}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .resumo div{background:#f1f3f9;border-radius:12px;padding:10px 12px}
  .resumo b{display:block;font-size:1.4rem}
  footer{max-width:1000px;margin:0 auto;padding:10px 16px 28px;color:var(--muted);font-size:.85rem;text-align:center}
  .vazio{color:var(--muted);padding:8px 0}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <div><h1>🎮 Gamefica Ação Matemática</h1><small>Painel do professor · atividades e relatórios</small></div>
  <div id="usuario"></div>
</div></header>
<main id="app"><div class="card">Carregando…</div></main>
<footer>Desenvolvido por <i>Prof. Dr. Haroldo Aleixo de Lima Junior</i></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js"></script>
<script src="supabase-config.js"></script>
<script src="jogos.js"></script>
<script>
(function(){
'use strict';

var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var app = document.getElementById('app');
var usuarioBox = document.getElementById('usuario');

var sessao = null;
var atividades = [];
var contagem = {};      // atividade_id -> número de alunos diferentes
var abertaId = null;    // atividade com resultados abertos
var modo = 'melhor';    // 'melhor' ou 'ultima'
var resultadosBrutos = [];
var modoLogin = 'entrar';

/* ---------- utilidades ---------- */
function el(tag, props){
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v === null || v === undefined || v === false) return;
    if(k === 'class') e.className = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else e.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    kids.forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function fmtNota(n){ return Number(n).toFixed(1).replace('.', ','); }
function fmtTempo(s){ if(s === null || s === undefined) return '—'; return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function fmtData(iso){ return new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}); }
function slug(t){ return (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase() || 'relatorio'; }
function linkDe(a){ return new URL('jogar.html?a=' + encodeURIComponent(a.codigo), location.href).href; }
function nomeJogo(id){ var j = window.JOGOS[id]; return j ? (j.emoji + ' ' + j.nome) : id; }
function msg(tipo, texto){ return el('div', {class:'msg ' + tipo, role:'alert'}, texto); }
function baixar(blob, nome){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.append(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copiar(texto, botao){
  function ok(){ var t = botao.textContent; botao.textContent = '✔ Copiado!'; setTimeout(function(){ botao.textContent = t; }, 1600); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok, function(){ window.prompt('Copie o link:', texto); });
  } else { window.prompt('Copie o link:', texto); }
}
function chaveAluno(r){
  return (r.aluno_nome || '').toLowerCase().replace(/\s+/g,' ').trim() + '|' + (r.aluno_turma || '').toLowerCase().trim();
}

/* ---------- início ---------- */
async function iniciar(){
  var r = await sb.auth.getSession();
  sessao = r.data.session;
  sb.auth.onAuthStateChange(function(evt, s){
    var mudou = (!!s) !== (!!sessao);
    sessao = s;
    if(mudou) telaInicial();
  });
  telaInicial();
}
async function telaInicial(){
  usuarioBox.replaceChildren();
  if(!sessao){ desenharLogin(); return; }
  var nome = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  usuarioBox.append(
    el('span', {}, '👤 ' + nome + '  '),
    el('button', {class:'sec peq', onclick: async function(){ await sb.auth.signOut(); }}, 'Sair')
  );
  await carregarAtividades();
  desenharPainel();
}

/* ---------- login ---------- */
function desenharLogin(msgNode){
  var email = el('input', {type:'email', id:'email', autocomplete:'email', placeholder:'seuemail@exemplo.com'});
  var senha = el('input', {type:'password', id:'senha', autocomplete: modoLogin === 'entrar' ? 'current-password' : 'new-password', placeholder:'mínimo 8 caracteres'});
  var nome  = el('input', {type:'text', id:'nome', autocomplete:'name', placeholder:'Como aparecerá nos relatórios'});
  var aviso = el('div');
  var botao = el('button', {type:'submit'}, modoLogin === 'entrar' ? 'Entrar' : 'Criar conta');

  var form = el('form', {onsubmit: async function(ev){
    ev.preventDefault();
    aviso.replaceChildren(); botao.disabled = true;
    try{
      if(modoLogin === 'entrar'){
        var r = await sb.auth.signInWithPassword({email: email.value.trim(), password: senha.value});
        if(r.error) throw r.error;
      } else {
        if(senha.value.length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.');
        if(nome.value.trim().length < 2) throw new Error('Informe seu nome.');
        var r2 = await sb.auth.signUp({
          email: email.value.trim(), password: senha.value,
          options: { data: {nome: nome.value.trim()}, emailRedirectTo: location.origin + location.pathname }
        });
        if(r2.error) throw r2.error;
        if(!r2.data.session){
          aviso.append(msg('ok', 'Conta criada! Enviamos uma mensagem de confirmação para o seu e-mail. Clique no link dela e depois volte aqui para entrar.'));
        }
      }
    }catch(e){
      var t = String(e.message || e);
      if(/invalid login/i.test(t)) t = 'E-mail ou senha incorretos.';
      else if(/already registered/i.test(t)) t = 'Este e-mail já tem conta. Use a aba "Entrar".';
      else if(/not confirmed/i.test(t)) t = 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada e o spam).';
      aviso.append(msg('erro', t));
    }
    botao.disabled = false;
  }},
    modoLogin === 'criar' ? [el('label', {for:'nome'}, 'Seu nome'), nome] : null,
    el('label', {for:'email'}, 'E-mail'), email,
    el('label', {for:'senha'}, 'Senha'), senha,
    el('div', {style:'margin-top:14px'}, botao),
    aviso
  );

  app.replaceChildren(el('div', {class:'card', style:'max-width:460px;margin:20px auto'},
    el('h2', {}, 'Acesso do professor'),
    el('div', {class:'tabs'},
      el('button', {class: modoLogin === 'entrar' ? 'ativo' : '', onclick: function(){ modoLogin = 'entrar'; desenharLogin(); }}, 'Entrar'),
      el('button', {class: modoLogin === 'criar' ? 'ativo' : '', onclick: function(){ modoLogin = 'criar'; desenharLogin(); }}, 'Criar conta')
    ),
    form,
    el('p', {class:'vazio'}, 'Os alunos não precisam de conta: eles só abrem o link da atividade.')
  ));
}

/* ---------- atividades ---------- */
async function carregarAtividades(){
  var a = await sb.from('atividades').select('*').order('criada_em', {ascending:false});
  atividades = a.error ? [] : a.data;
  var r = await sb.from('resultados').select('atividade_id,aluno_nome,aluno_turma').limit(5000);
  contagem = {};
  if(!r.error){
    var vistos = {};
    r.data.forEach(function(x){
      var k = x.atividade_id + '#' + chaveAluno(x);
      if(!vistos[k]){ vistos[k] = 1; contagem[x.atividade_id] = (contagem[x.atividade_id] || 0) + 1; }
    });
  }
}

function desenharPainel(){
  var selJogo = el('select', {id:'jogo'}, Object.keys(window.JOGOS).map(function(id){ return el('option', {value:id}, nomeJogo(id)); }));
  var titulo = el('input', {type:'text', id:'titulo', maxlength:'120', placeholder:'Ex.: Porcentagem – lista 1'});
  var turma  = el('input', {type:'text', id:'turma', maxlength:'40', placeholder:'Ex.: 3ª A (opcional)'});
  var aviso  = el('div');
  var botao  = el('button', {type:'submit'}, '➕ Criar atividade e gerar link');

  var form = el('form', {onsubmit: async function(ev){
    ev.preventDefault(); aviso.replaceChildren(); botao.disabled = true;
    var t = titulo.value.trim();
    if(!t){ aviso.append(msg('erro', 'Dê um nome à atividade.')); botao.disabled = false; return; }
    var r = await sb.from('atividades').insert({jogo: selJogo.value, titulo: t, turma: turma.value.trim() || null}).select().single();
    botao.disabled = false;
    if(r.error){ aviso.append(msg('erro', 'Não foi possível criar: ' + r.error.message)); return; }
    await carregarAtividades(); abertaId = null; desenharPainel();
  }},
    el('div', {class:'grade'},
      el('div', {}, el('label', {for:'jogo'}, 'Jogo'), selJogo),
      el('div', {}, el('label', {for:'titulo'}, 'Nome da atividade'), titulo),
      el('div', {}, el('label', {for:'turma'}, 'Turma'), turma)
    ),
    el('div', {style:'margin-top:14px'}, botao),
    aviso
  );

  var lista = atividades.length === 0
    ? [el('p', {class:'vazio'}, 'Você ainda não criou nenhuma atividade. Crie a primeira acima.')]
    : atividades.map(cartaoAtividade);

  app.replaceChildren(
    el('div', {class:'card'}, el('h2', {}, 'Nova atividade'), form),
    el('div', {class:'card'}, el('h2', {}, 'Minhas atividades'), lista),
    el('div', {id:'area-resultados'})
  );
  if(abertaId) mostrarResultados(abertaId);
}

function cartaoAtividade(a){
  var link = linkDe(a);
  var btnCopiar = el('button', {class:'peq'}, '📋 Copiar link');
  btnCopiar.addEventListener('click', function(){ copiar(link, btnCopiar); });
  var alunos = contagem[a.id] || 0;
  return el('div', {class:'ativ'},
    el('h3', {}, a.titulo),
    el('div', {},
      el('span', {class:'tag'}, nomeJogo(a.jogo)),
      a.turma ? el('span', {class:'tag'}, a.turma) : null,
      el('span', {class:'tag' + (a.ativa ? '' : ' enc')}, a.ativa ? 'Aberta' : 'Encerrada'),
      el('span', {class:'tag'}, alunos + (alunos === 1 ? ' aluno' : ' alunos'))
    ),
    el('div', {class:'link'}, link),
    el('div', {class:'linha'},
      btnCopiar,
      el('button', {class:'peq sec', onclick: function(){ abertaId = a.id; mostrarResultados(a.id, true); }}, '📊 Ver resultados'),
      el('button', {class:'peq sec', onclick: async function(){
        var r = await sb.from('atividades').update({ativa: !a.ativa}).eq('id', a.id);
        if(!r.error){ await carregarAtividades(); desenharPainel(); }
      }}, a.ativa ? '⏸ Encerrar' : '▶ Reabrir'),
      el('button', {class:'peq perigo', onclick: async function(){
        if(!window.confirm('Excluir "' + a.titulo + '" e todos os resultados dela? Isso não pode ser desfeito.')) return;
        var r = await sb.from('atividades').delete().eq('id', a.id);
        if(!r.error){ if(abertaId === a.id) abertaId = null; await carregarAtividades(); desenharPainel(); }
      }}, '🗑 Excluir')
    )
  );
}

/* ---------- resultados ---------- */
function consolidar(brutos){
  var porAluno = {};
  brutos.forEach(function(r){
    var k = chaveAluno(r);
    var g = porAluno[k] || (porAluno[k] = {nome: r.aluno_nome, turma: r.aluno_turma || '', tentativas: 0, escolhido: null});
    g.tentativas++;
    var c = g.escolhido;
    if(modo === 'ultima'){
      if(!c || r.enviado_em >= c.enviado_em) g.escolhido = r;
    } else {
      if(!c || Number(r.nota) > Number(c.nota) || (Number(r.nota) === Number(c.nota) && r.pontos > c.pontos)) g.escolhido = r;
    }
  });
  return Object.keys(porAluno).map(function(k){ return porAluno[k]; })
    .sort(function(a, b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
}

async function mostrarResultados(id, rolar){
  var area = document.getElementById('area-resultados');
  var a = atividades.find(function(x){ return x.id === id; });
  if(!a){ area.replaceChildren(); return; }
  area.replaceChildren(el('div', {class:'card'}, 'Carregando resultados…'));
  var r = await sb.from('resultados').select('*').eq('atividade_id', id).order('enviado_em', {ascending:true}).limit(5000);
  if(r.error){ area.replaceChildren(el('div', {class:'card'}, msg('erro', 'Erro ao carregar: ' + r.error.message))); return; }
  resultadosBrutos = r.data;
  desenharResultados(a);
  if(rolar) area.scrollIntoView({behavior:'smooth', block:'start'});
}

function desenharResultados(a){
  var area = document.getElementById('area-resultados');
  var linhas = consolidar(resultadosBrutos);
  var notas = linhas.map(function(l){ return Number(l.escolhido.nota); });
  var media = notas.length ? notas.reduce(function(s, n){ return s + n; }, 0) / notas.length : 0;
  var acima = notas.filter(function(n){ return n >= 6; }).length;

  var selModo = el('select', {style:'width:auto', onchange: function(){ modo = this.value; desenharResultados(a); }},
    el('option', {value:'melhor'}, 'Contar a melhor tentativa'),
    el('option', {value:'ultima'}, 'Contar a última tentativa'));
  selModo.value = modo;

  var corpo = linhas.length === 0
    ? el('p', {class:'vazio'}, 'Nenhum aluno enviou resultado ainda. Cole o link da atividade na Sala do Futuro ou no Moodle.')
    : el('div', {class:'tabela-wrap'}, el('table', {},
        el('thead', {}, el('tr', {},
          el('th', {class:'n'}, 'Nº'), el('th', {}, 'Aluno'), el('th', {}, 'Turma'),
          el('th', {class:'n'}, 'Acertos'), el('th', {class:'n'}, 'Nota'),
          el('th', {class:'n'}, 'Tentativas'), el('th', {class:'n'}, 'Tempo'), el('th', {}, 'Enviado em'))),
        el('tbody', {}, linhas.map(function(l, i){
          var e = l.escolhido, n = Number(e.nota);
          return el('tr', {},
            el('td', {class:'n'}, i + 1), el('td', {}, l.nome), el('td', {}, l.turma || '—'),
            el('td', {class:'n'}, e.acertos + '/' + e.total_questoes),
            el('td', {class:'n ' + (n >= 6 ? 'nota-alta' : 'nota-baixa')}, fmtNota(n)),
            el('td', {class:'n'}, l.tentativas), el('td', {class:'n'}, fmtTempo(e.tempo_segundos)),
            el('td', {}, fmtData(e.enviado_em)));
        }))));

  area.replaceChildren(el('div', {class:'card'},
    el('h2', {}, '📊 Resultados: ' + a.titulo),
    el('div', {class:'resumo'},
      el('div', {}, el('b', {}, linhas.length), 'alunos'),
      el('div', {}, el('b', {}, linhas.length ? fmtNota(media) : '—'), 'média da turma'),
      el('div', {}, el('b', {}, linhas.length ? acima + '/' + linhas.length : '—'), 'com nota ≥ 6,0')),
    el('div', {class:'linha', style:'margin-bottom:10px'},
      selModo,
      el('button', {class:'peq', onclick: function(){ baixarWord(a, linhas, media); }, disabled: linhas.length ? null : 'disabled'}, '📄 Baixar Word (.docx)'),
      el('button', {class:'peq sec', onclick: function(){ baixarCsv(a, linhas); }, disabled: linhas.length ? null : 'disabled'}, '📑 Baixar Excel (.csv)'),
      el('button', {class:'peq sec', onclick: function(){ mostrarResultados(a.id); }}, '🔄 Atualizar')),
    corpo,
    el('p', {class:'vazio'}, 'A nota vai de 0 a 10 e é calculada pelo servidor: acertos ÷ total de questões × 10.')
  ));
}

/* ---------- exportações ---------- */
function baixarCsv(a, linhas){
  function cel(v){
    var t = String(v === null || v === undefined ? '' : v);
    if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // evita que o Excel trate o texto como fórmula
    return '"' + t.replace(/"/g, '""') + '"';
  }
  var rows = [['Nº','Aluno','Turma','Acertos','Total de questões','Nota','Tentativas','Tempo','Enviado em']];
  linhas.forEach(function(l, i){
    var e = l.escolhido;
    rows.push([i + 1, l.nome, l.turma, e.acertos, e.total_questoes, fmtNota(e.nota), l.tentativas, fmtTempo(e.tempo_segundos), fmtData(e.enviado_em)]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(cel).join(';'); }).join('\r\n');
  baixar(new Blob([csv], {type:'text/csv;charset=utf-8'}), 'resultados-' + slug(a.titulo) + '.csv');
}

async function baixarWord(a, linhas, media){
  if(!window.docx){ window.alert('A biblioteca do Word não carregou. Verifique a internet e tente de novo.'); return; }
  var D = window.docx;
  var nomeProf = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  var larguras = [600, 3500, 1300, 1300, 1100, 1838];   // soma = 9638 (A4 com margens de 2 cm)
  var borda = {style: D.BorderStyle.SINGLE, size: 4, color: 'B8C0D9'};
  var bordas = {top:borda, bottom:borda, left:borda, right:borda};

  function celula(texto, i, opt){
    opt = opt || {};
    return new D.TableCell({
      width: {size: larguras[i], type: D.WidthType.DXA},
      borders: bordas,
      shading: opt.cabecalho ? {fill:'E3E7FA', type: D.ShadingType.CLEAR, color:'auto'} : undefined,
      margins: {top: 70, bottom: 70, left: 100, right: 100},
      children: [new D.Paragraph({
        alignment: opt.centro ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
        children: [new D.TextRun({text: String(texto), bold: !!opt.cabecalho || !!opt.negrito, size: 22, font: 'Arial'})]
      })]
    });
  }
  function par(rotulo, valor){
    return new D.Paragraph({spacing:{after:60}, children:[
      new D.TextRun({text: rotulo + ': ', bold:true, size:23, font:'Arial'}),
      new D.TextRun({text: String(valor), size:23, font:'Arial'})]});
  }

  var cab = new D.TableRow({tableHeader:true, children:[
    celula('Nº',0,{cabecalho:true,centro:true}), celula('Aluno',1,{cabecalho:true}), celula('Turma',2,{cabecalho:true}),
    celula('Acertos',3,{cabecalho:true,centro:true}), celula('Nota',4,{cabecalho:true,centro:true}), celula('Tentativas',5,{cabecalho:true,centro:true})]});
  var corpo = linhas.map(function(l, i){
    var e = l.escolhido;
    return new D.TableRow({cantSplit:true, children:[
      celula(i+1,0,{centro:true}), celula(l.nome,1), celula(l.turma || '—',2),
      celula(e.acertos + '/' + e.total_questoes,3,{centro:true}), celula(fmtNota(e.nota),4,{centro:true,negrito:true}),
      celula(l.tentativas,5,{centro:true})]});
  });

  var doc = new D.Document({
    creator: nomeProf, title: 'Relatório – ' + a.titulo,
    sections: [{
      properties: {page: {size: {width: 11906, height: 16838}, margin: {top:1134, bottom:1134, left:1134, right:1134}}},
      children: [
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:80}, children:[
          new D.TextRun({text:'Relatório da Atividade', bold:true, size:36, font:'Arial'})]}),
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:240}, children:[
          new D.TextRun({text: a.titulo, size:28, font:'Arial', color:'4F46E5'})]}),
        par('Jogo', (window.JOGOS[a.jogo] ? window.JOGOS[a.jogo].nome : a.jogo)),
        par('Turma', a.turma || '—'),
        par('Professor(a)', nomeProf),
        par('Gerado em', new Date().toLocaleString('pt-BR', {dateStyle:'long', timeStyle:'short'})),
        par('Critério da nota', modo === 'ultima' ? 'última tentativa de cada aluno' : 'melhor tentativa de cada aluno'),
        par('Alunos que participaram', linhas.length),
        par('Média da turma', fmtNota(media)),
        new D.Paragraph({spacing:{before:200, after:120}, children:[]}),
        new D.Table({width:{size:9638, type:D.WidthType.DXA}, columnWidths: larguras, rows:[cab].concat(corpo)}),
        new D.Paragraph({spacing:{before:200}, children:[
          new D.TextRun({text:'Nota de 0 a 10 = acertos ÷ total de questões × 10. Gerado pelo portal Gamefica Ação Matemática.', italics:true, size:18, font:'Arial', color:'5D6785'})]})
      ]
    }]
  });
  var blob = await D.Packer.toBlob(doc);
  baixar(blob, 'relatorio-' + slug(a.titulo) + '.docx');
}

iniciar();
})();
</script>
